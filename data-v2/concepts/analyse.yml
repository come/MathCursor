# Concept "analyse" — intégrales, dérivées, double intégrale.
# Migration des patterns legacy IntegralTemplate, DerivativeTemplate,
# double_integral.yaml vers Engine v2 (brief v5).
# Cf. ADR 2026-05-22-Feat-engine-poc-isolation + P16.

concept: analyse
rules:
  # ─── Intégrale définie : int x a b f(x) ───────────────────────────
  - id: integrale-def
    anchor: int
    shape: "int {var} {from:bound} {to:bound} {body}"
    emit:  "\\int_{$from}^{$to} $body \\, d$var"
    tests:
      - "int x 0 1 x => \\int_{0}^{1} x \\, dx"
      - "int x 0 1 x^2 => \\int_{0}^{1} x^2 \\, dx"
      - "int t 0 +oo f(t) => \\int_{0}^{+\\infty} f(t) \\, dt"
      - "int t 0 +inf f(t) => \\int_{0}^{+\\infty} f(t) \\, dt"

  # ─── Intégrale indéfinie : int x f(x) ─────────────────────────────
  # (= 2 slots seulement, pas de bornes)
  - id: integrale-indef
    anchor: int
    shape: "int {var} {body}"
    emit:  "\\int $body \\, d$var"
    tests:
      - "int x 2x => \\int 2x \\, dx"
      - "int t sin(t) => \\int \\sin(t) \\, dt"

  # ─── Dérivée d/dx f(x) : derive x f(x) ────────────────────────────
  - id: derivee
    anchor: derive
    shape: "derive {var} {body}"
    emit:  "\\frac{d}{d$var} $body"
    tests:
      - "derive x x^2 => \\frac{d}{dx} x^2"
      - "derive t e^t => \\frac{d}{dt} e^t"
      - "derive x sin(x) => \\frac{d}{dx} \\sin(x)"

  # ─── Intégrale double : iint x y f(x,y) ───────────────────────────
  # 2 vars consécutives puis body
  - id: integrale-double
    anchor: iint
    shape: "iint {var1:var} {var2:var} {body}"
    emit:  "\\iint $body \\, d$var1 \\, d$var2"
    tests:
      - "iint x y f(x,y) => \\iint f(x,y) \\, dx \\, dy"
      - "iint x y g(x,y) => \\iint g(x,y) \\, dx \\, dy"

# Concept "congruences" — `a congru b [n]` ou `a congru b mod n`.
# Notation arithmétique modulaire.

concept: congruences
rules:
  # `congru a b n` (= 3 args explicites) → a ≡ b (mod n)
  - id: congruence-explicit
    anchor: congru
    shape: "congru {a:expr} {b:expr} {n:expr}"
    emit:  "$a \\equiv $b \\pmod{$n}"
    tests:
      - "congru a b n => a \\equiv b \\pmod{n}"
      - "congru x y 7 => x \\equiv y \\pmod{7}"

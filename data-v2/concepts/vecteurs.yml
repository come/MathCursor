# Concept "vecteurs" — notation \vec.
# `vec u` → \vec{u}, `vec AB` → \vec{AB}.

concept: vecteurs
rules:
  - id: vec-explicit
    anchor: vec
    shape: "vec {body}"
    emit:  "\\vec{$body}"
    tests:
      - "vec u => \\vec{u}"
      - "vec v => \\vec{v}"
      - "vec AB => \\vec{AB}"
      - "vec CD => \\vec{CD}"
      - "vec n+1 => \\vec{n+1}"

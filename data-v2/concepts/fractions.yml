# Concept "fractions" — frac et racines.
# `a/b` est déjà géré par le parser (= LatexEmitter `/` → `\frac`).
# Ce fichier couvre la syntaxe explicite `frac a b` et `racine x`.

concept: fractions
rules:
  # ─── Fraction explicite : frac num den ────────────────────────────
  - id: frac-explicit
    anchor: frac
    shape: "frac {num:bound} {den:body}"
    emit:  "\\frac{$num}{$den}"
    tests:
      - "frac a b => \\frac{a}{b}"
      - "frac 1 2 => \\frac{1}{2}"
      - "frac (x+1) (x-1) => \\frac{x+1}{x-1}"
      - "frac n n+1 => \\frac{n}{n+1}"

  # ─── Racine carrée : sqrt x ───────────────────────────────────────
  - id: racine-carree
    anchor: sqrt
    shape: "sqrt {body}"
    emit:  "\\sqrt{$body}"
    tests:
      - "sqrt 2 => \\sqrt{2}"
      - "sqrt x => \\sqrt{x}"
      - "sqrt (x+1) => \\sqrt{x+1}"
      - "sqrt x^2+y^2 => \\sqrt{x^2+y^2}"

  # ─── Racine n-ième : sqrt n x (= shape avec ordre n d'abord) ──────
  # Notation : `sqrt 3 8` = ∛8 = `\sqrt[3]{8}`.
  - id: racine-niem
    anchor: sqrt
    shape: "sqrt {n:const} {body}"
    emit:  "\\sqrt[$n]{$body}"
    tests:
      - "sqrt 3 8 => \\sqrt[3]{8}"
      - "sqrt 4 16 => \\sqrt[4]{16}"

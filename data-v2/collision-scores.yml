# Scores de collision déclarés en YAML — pilote l'ordre d'affichage popup.
# Plus haut score = plus prioritaire dans la liste des alts.
# Cf. ADR 2026-05-22-Feat-engine-poc-isolation + P31.

scores:
  # Slurps : démotés (= alts à proposer, défaut reste left-assoc).
  fraction-slurp:     80
  supsub-slurp-sup:   80
  supsub-slurp-sub:   80

  # Reinterpretations sur même base.
  letter-sub-number:  75
  dot-vec:            75

  # Notations géométriques.
  vec:                70
  triangle:           65
  vec-coords:         60

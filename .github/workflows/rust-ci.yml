# CI cross-OS du cœur Rust (Phase 4) : build les 3 crates (mc-engine, mc-ner,
# mc-popup) + rejoue le gate moteur 456/456, et upload les binaires.
#
# Coût (dépôt PRIVÉ) : macOS = ×10 minutes. Donc matrice DYNAMIQUE :
#  - push touchant rust/  → Linux + Windows seulement (×1 + ×2) ;
#  - workflow_dispatch     → + macOS (à la demande, quand on veut le valider).
name: rust-ci

on:
  push:
    paths:
      - 'rust/**'
      - 'data/engine/**'
      - 'engine/tests/MathCursor.Engine.Tests/fixtures.json'
      - '.github/workflows/rust-ci.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.set.outputs.os }}
    steps:
      - id: set
        # macOS (×10) seulement en déclenchement manuel.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.os) }}
    steps:
      - uses: actions/checkout@v4

      # wry/tao sous Linux : backend WebKitGTK + GTK (fournis par l'OS sur
      # mac = WKWebView et Windows = WebView2).
      - name: Dépendances webview (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libxdo-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Build workspace (release)
        working-directory: rust
        run: cargo build --release --workspace

      - name: Gate moteur — conformance 456/456
        working-directory: rust
        run: cargo run --release -p mc-engine --bin conformance

      - name: Upload binaires
        uses: actions/upload-artifact@v4
        with:
          name: mc-binaries-${{ matrix.os }}
          path: |
            rust/target/release/analyze
            rust/target/release/analyze.exe
            rust/target/release/mc-ner
            rust/target/release/mc-ner.exe
            rust/target/release/mc-popup
            rust/target/release/mc-popup.exe
          if-no-files-found: warn

name: Release VSTO

# Déclenché par push de tag v* (ex: v0.1.0) ou manuellement
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version ClickOnce (ex: 0.1.0)"
        required: true

permissions:
  contents: write

env:
  PROJECT_PATH: adapter-vsto/src/MathCursor/MathCursor.csproj
  PUBLISH_URL: https://come.github.io/MathCursor/release/
  # L'URL que les testeurs utiliseront pour lancer l'install
  SETUP_URL: https://come.github.io/MathCursor/release/setup.exe

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Déterminer la version ClickOnce
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $raw = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $raw = "${{ github.event.inputs.version }}"
          }
          # ClickOnce exige x.y.z.w → on pad avec .0 si besoin
          if ($raw -match "^\d+\.\d+$")        { $raw = "$raw.0.0" }
          elseif ($raw -match "^\d+\.\d+\.\d+$") { $raw = "$raw.0" }
          if ($raw -notmatch "^\d+\.\d+\.\d+\.\d+$") {
            Write-Error "Version invalide : $raw (attendu : x.y ou x.y.z ou x.y.z.w)"
            exit 1
          }
          Write-Output "Version ClickOnce : $raw"
          "version=$raw" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Import du certificat (clé privée)
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.PFX_BASE64 }}")
          $pfxPath  = Join-Path $env:RUNNER_TEMP "mathcursor.pfx"
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

          $securePwd = ConvertTo-SecureString -String "${{ secrets.PFX_PASSWORD }}" -Force -AsPlainText
          Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $securePwd | Out-Null

          # On garde le chemin pour MSBuild (ManifestKeyFile fallback)
          "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore + Build + Publish ClickOnce
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "publish"
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }

          msbuild `
            "$env:PROJECT_PATH" `
            /t:Restore,Publish `
            /p:Configuration=Release `
            /p:Platform="AnyCPU" `
            /p:PublishDir="$publishDir\" `
            /p:PublishUrl="$env:PUBLISH_URL" `
            /p:InstallUrl="$env:PUBLISH_URL" `
            /p:UpdateUrl="$env:PUBLISH_URL" `
            /p:ApplicationVersion="${{ steps.version.outputs.version }}" `
            /p:MinimumRequiredVersion="${{ steps.version.outputs.version }}" `
            /p:Install=true `
            /p:UpdateEnabled=true `
            /p:UpdateMode=Foreground `
            /p:IsWebBootstrapper=true `
            /p:BootstrapperEnabled=true `
            /p:GenerateManifests=true `
            /p:SignManifests=true `
            /p:ManifestCertificateThumbprint="${{ secrets.PFX_THUMBPRINT }}" `
            /p:ManifestKeyFile="$env:PFX_PATH" `
            /p:TargetZone=Custom

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Vérification des artifacts
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "publish"
          Write-Output "Contenu de $publishDir :"
          Get-ChildItem -Recurse $publishDir | Select-Object FullName
          # On attend au minimum : setup.exe, MathCursor.vsto, Application Files/
          foreach ($f in @("setup.exe", "MathCursor.vsto")) {
            $p = Join-Path $publishDir $f
            if (-not (Test-Path $p)) {
              Write-Error "Fichier attendu manquant : $p"
              exit 1
            }
          }

      - name: Déploiement vers main (docs/release/)
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "publish"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main

          $releaseDir = "docs/release"
          if (Test-Path $releaseDir) { Remove-Item -Recurse -Force $releaseDir }
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          Copy-Item -Recurse -Force "$publishDir\*" $releaseDir

          git add $releaseDir
          if (-not (git diff --cached --quiet)) {
            git commit -m "Release ${{ steps.version.outputs.version }} (automated)"
            git push origin main
          } else {
            Write-Output "Aucun changement à commiter."
          }

      - name: Nettoyage
        if: always()
        shell: pwsh
        run: |
          # Retire le PFX du cert store du runner (par précaution,
          # même si le runner est éphémère)
          Get-ChildItem Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint -eq "${{ secrets.PFX_THUMBPRINT }}" } |
            Remove-Item -Force -ErrorAction SilentlyContinue
          if ($env:PFX_PATH -and (Test-Path $env:PFX_PATH)) {
            Remove-Item -Force $env:PFX_PATH
          }

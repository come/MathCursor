# Workspace Rust MathCursor — cœur partagé des hosts non-Word (cf. ADR
# 2026-06-24-Feat-rust-unified-toolkit). Phase 1 : mc-popup (coquille au caret).
# Phase 2 : mc-engine (moteur forest porté du C#/Python, gate fixtures.json).
[workspace]
resolver = "2"
members = ["mc-popup", "mc-engine", "mc-ner"]

# panic = "unwind" (défaut) : le binaire `analyze` rattrape les panics moteur
# (caractère inattendu sur entrée libre) via catch_unwind → renvoie "erreur" sans
# tuer le process persistant. Coût taille négligeable vs robustesse.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

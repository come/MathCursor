<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="./katex/katex.min.css" />
<script defer src="./katex/katex.min.js"></script>
<style>
  /* HTML PARTAGÉ (VSCode + LibreOffice), servi par mc-popup via mc://.
     Le HTML possède l'état (candidats, repli "voir plus", sélection) ; l'hôte
     ne fait que transmettre l'intention (mcNav / mcActivate). Thème via
     [data-theme] : l'hôte force (VSCode dark/light ; LibreOffice light) ; à
     défaut ("auto") on suit prefers-color-scheme. */
  :root, html[data-theme="dark"] {
    --bg: #252526; --border: #454545; --fg: #d4d4d4; --dim: #7c7c7c; --sel: #094771;
  }
  html[data-theme="light"] {
    --bg: #fbfbfb; --border: #c8c8c8; --fg: #1e1e1e; --dim: #9a9a9a; --sel: #d6e8ff;
  }
  html, body { margin: 0; overflow: hidden; background: var(--bg); line-height: 0; }
  #card {
    display: inline-block;
    background: var(--bg);
    padding: 4px;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--fg);
    user-select: none;
    white-space: nowrap;
    line-height: normal;
  }
  .row { padding: 8px 14px; border-radius: 4px; cursor: pointer; text-align: left; }
  .row.sel { background: var(--sel); }
  .row .formula { text-align: left; }
  .row .formula .katex { color: var(--fg); }
  .row .formula .katex-display { margin: 0; text-align: left; }
  .row .formula .katex-display > .katex { text-align: left; }
  .row .code {
    margin-top: 3px;
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 10.5px;
    color: var(--dim);
    text-align: right;
  }
  /* Ligne "voir plus" (façon Word) : flèche bas dessus → déploie. */
  .more { padding: 6px 14px; border-radius: 4px; cursor: pointer; text-align: center;
    color: var(--dim); font-family: "Segoe UI", system-ui, sans-serif; font-size: 11px; }
  .more.sel { background: var(--sel); color: var(--fg); }
</style>
</head>
<body>
<div id="card"></div>
<script>
  var _cands = [];        // tous les candidats classés
  var _sel = -1;          // ligne sélectionnée (-1 = aucune) ; inclut la ligne "voir plus"
  var _showLatex = true;  // ligne LaTeX sous la formule (optionnelle)
  var _collapseAt = 0;    // 0 = pas de repli ; sinon n premiers + "voir plus"
  var _expanded = false;  // "voir plus" déployé ?
  var _moreLabel = "show more"; // phrase de la ligne « voir plus », fournie (localisée) par l'hôte ; défaut EN

  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

  function resolveTheme(theme) {
    if (theme === "dark" || theme === "light") { return theme; }
    try { return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }
    catch (e) { return "light"; }
  }

  function hasMore() { return _collapseAt > 0 && !_expanded && _cands.length > _collapseAt; }
  function visibleCount() { return hasMore() ? _collapseAt : _cands.length; }
  function moreIndex() { return hasMore() ? visibleCount() : -1; }   // index de "voir plus"
  function navCount() { return visibleCount() + (hasMore() ? 1 : 0); }

  function postSize() {
    var card = document.getElementById("card");
    var dpr = window.devicePixelRatio || 1;
    var w = Math.ceil(card.offsetWidth * dpr);
    var h = Math.ceil(card.offsetHeight * dpr);
    if (w > 0 && h > 0 && window.ipc) {
      window.ipc.postMessage("size:" + JSON.stringify({ w: w, h: h }));
    }
  }
  function postSizeSoon() {
    requestAnimationFrame(postSize);
    setTimeout(postSize, 60);
    setTimeout(postSize, 200);
  }

  function render() {
    var card = document.getElementById("card");
    card.innerHTML = "";
    var vc = visibleCount();
    for (var i = 0; i < vc; i++) {
      var latex = _cands[i].latex || "";
      var row = document.createElement("div");
      row.className = "row" + (i === _sel ? " sel" : "");
      row.dataset.i = i;

      var f = document.createElement("div");
      f.className = "formula";
      try { katex.render(latex, f, { throwOnError: false, displayMode: true }); }
      catch (e) { f.textContent = latex; }
      row.appendChild(f);

      if (_showLatex) {
        var c = document.createElement("div");
        c.className = "code";
        c.innerHTML = esc(latex);
        row.appendChild(c);
      }

      row.addEventListener("mousedown", function (ev) {
        ev.preventDefault();
        if (window.mcCommit) { window.mcCommit(parseInt(this.dataset.i, 10)); }
      });
      card.appendChild(row);
    }
    if (hasMore()) {
      var more = document.createElement("div");
      more.className = "more" + (_sel === moreIndex() ? " sel" : "");
      more.textContent = "▾ " + _moreLabel + " (" + (_cands.length - vc) + ")";
      more.addEventListener("mousedown", function (ev) { ev.preventDefault(); expand(); });
      card.appendChild(more);
    }
    postSizeSoon();
  }

  function expand() {
    _expanded = true;
    if (_sel > _cands.length - 1) { _sel = _cands.length - 1; }
    render();
  }

  window.mcRender = function (cands, sel, theme, showLatex, collapseAt, moreLabel) {
    _cands = cands || [];
    _sel = (typeof sel === "number") ? sel : -1;
    _showLatex = (showLatex !== false);
    _collapseAt = (typeof collapseAt === "number") ? collapseAt : 0;
    _moreLabel = (typeof moreLabel === "string" && moreLabel) ? moreLabel : "show more";
    _expanded = false;
    document.documentElement.dataset.theme = resolveTheme(theme);
    render();
  };

  // Navigation (transmise par l'hôte : VSCode hook clavier, LibreOffice UNO).
  window.mcNav = function (delta) {
    var nc = navCount();
    if (nc === 0) { return; }
    if (_sel < 0) { _sel = (delta > 0) ? 0 : (nc - 1); render(); return; }
    // flèche bas SUR "voir plus" → déploie (puis sélectionne le 1ᵉʳ révélé).
    if (delta > 0 && _sel === moreIndex()) {
      var first = visibleCount();
      expand();
      _sel = Math.min(first, _cands.length - 1);
      render();
      return;
    }
    _sel = Math.max(0, Math.min(_sel + delta, nc - 1));
    render();
  };

  // Validation (clic, ou touche transmise par l'hôte) : "voir plus" → déploie ;
  // ligne surlignée → valide ; AUCUNE sélection → ne valide QUE si `implicit`
  // (touche commit-1er désignée par l'hôte, façon Tab dans Word). Sinon : rien —
  // l'hôte laisse alors la touche (Entrée) redescendre à l'éditeur.
  window.mcActivate = function (implicit) {
    if (hasMore() && _sel === moreIndex()) { expand(); _sel = visibleCount() > 0 ? _collapseAt : 0; render(); return; }
    if (_sel >= 0) { if (window.mcCommit) { window.mcCommit(_sel); } return; }
    if (implicit && window.mcCommit) { window.mcCommit(0); }
  };

  // Rétrocompat (Update direct) — non utilisé avec mcNav, gardé par sûreté.
  window.mcSetIndex = function (i) { _sel = i; render(); };

  if (window.ResizeObserver) {
    new ResizeObserver(postSize).observe(document.getElementById("card"));
  }

  window.addEventListener("load", function () {
    function ready() {
      if (window.katex && window.ipc) { window.ipc.postMessage("loaded"); }
      else { setTimeout(ready, 20); }
    }
    ready();
  });
</script>
</body>
</html>

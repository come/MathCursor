[package]
name = "mc-popup"
version = "0.1.0"
edition = "2021"

# Coquille popup au caret (wry+tao+KaTeX). Deux modes :
#  - passif  : coords + clavier fournis par le host (LibreOffice).
#  - actif   : la coquille lit le caret (MSAA) et capte le clavier (hook bas
#              niveau) elle-même (VSCode, qui n'expose ni l'un ni l'autre).
[dependencies]
wry = "0.45"
tao = "0.30"
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_Graphics_Dwm",
]

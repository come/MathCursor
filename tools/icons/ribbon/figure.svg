<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Triangle rectangle avec sommets et marqueur d'angle droit -->
  <polygon points="5,19 19,19 5,6" />
  <!-- Marqueur d'angle droit en bas-gauche (petit carré inscrit) -->
  <polyline points="5,17 7,17 7,19" />
  <!-- Sommets en gros points -->
  <circle cx="5" cy="6" r="1.3" fill="#333" stroke="none" />
  <circle cx="5" cy="19" r="1.3" fill="#333" stroke="none" />
  <circle cx="19" cy="19" r="1.3" fill="#333" stroke="none" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Tableau de variation : cadre 2×3 avec flèches ↗ ↘ dans la ligne f(x) -->
  <rect x="3" y="5" width="18" height="14" rx="1" />
  <!-- Séparation horizontale entre ligne x et ligne f(x) -->
  <line x1="3" y1="10" x2="21" y2="10" />
  <!-- Séparations verticales (3 colonnes) -->
  <line x1="10" y1="5" x2="10" y2="19" />
  <line x1="14" y1="5" x2="14" y2="19" />
  <!-- Flèche ↗ croissance (col gauche) -->
  <path d="M5 17 L9 12" />
  <path d="M7.5 12 L9 12 L9 13.5" />
  <!-- Flèche ↘ décroissance (col droite) -->
  <path d="M15 12 L19 17" />
  <path d="M15 13.5 L15 12 L16.5 12" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Tableau de signe : grille 2×3 avec + et − -->
  <rect x="3" y="6" width="18" height="12" rx="1" />
  <line x1="3" y1="12" x2="21" y2="12" />
  <line x1="9" y1="6" x2="9" y2="18" />
  <line x1="15" y1="6" x2="15" y2="18" />
  <!-- Symboles + et − -->
  <text x="5" y="11" font-family="serif" font-size="5" fill="#333" stroke="none">x</text>
  <text x="11" y="11" font-family="serif" font-size="6" font-weight="600" fill="#333" stroke="none">+</text>
  <text x="17" y="11" font-family="serif" font-size="6" font-weight="600" fill="#333" stroke="none">−</text>
  <text x="11" y="17" font-family="serif" font-size="6" font-weight="600" fill="#333" stroke="none">−</text>
  <text x="17" y="17" font-family="serif" font-size="6" font-weight="600" fill="#333" stroke="none">+</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 3 sliders horizontaux avec poignées à positions différentes -->
  <!-- Slider 1 : poignée à droite -->
  <line x1="3" y1="6" x2="21" y2="6" />
  <circle cx="16" cy="6" r="2" fill="white" />
  <!-- Slider 2 : poignée à gauche -->
  <line x1="3" y1="12" x2="21" y2="12" />
  <circle cx="8" cy="12" r="2" fill="white" />
  <!-- Slider 3 : poignée au centre -->
  <line x1="3" y1="18" x2="21" y2="18" />
  <circle cx="13" cy="18" r="2" fill="white" />
</svg>

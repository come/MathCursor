# Worker d'alerte e-mail du chat du site (cf. ADR 2026-11-02-Feat-site-live-chat).
# Déploiement : npx wrangler deploy --config tools/mathcursor-notify/wrangler.toml
# Adresse de l'auteur (à saisir soi-même, jamais dans le dépôt) :
#   npx wrangler secret put TO --config tools/mathcursor-notify/wrangler.toml
# Prérequis : Email Routing activé sur mathcursor.com, adresse TO vérifiée.
name = "mathcursor-notify"
main = "worker.js"
compatibility_date = "2024-10-22"
# pas d'adresse publique : seul le projet Pages mathcursor l'appelle (liaison NOTIFY)
workers_dev = false
preview_urls = false

[[send_email]]
name = "MAIL"

[vars]
FROM = "chat@mathcursor.com"

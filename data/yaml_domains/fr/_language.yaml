# Français — stop phrases, connecteurs, vocabulaire de transition

language: fr
version: 1

stop_phrases:
  - { phrase: "on a",         type: verb }
  - { phrase: "on sait que",  type: verb }
  - { phrase: "on pose",      type: verb }
  - { phrase: "on note",      type: verb }
  - { phrase: "on cherche",   type: verb }
  - { phrase: "soit",         type: verb }
  - { phrase: "soient",       type: verb }
  - { phrase: "posons",       type: verb }
  - { phrase: "notons",       type: verb }
  - { phrase: "considerons",  type: verb }
  - { phrase: "supposons que", type: verb }
  - { phrase: "il existe",    type: quantifier, maps_to: EXISTS }
  - { phrase: "pour tout",    type: quantifier, maps_to: FORALL }
  - { phrase: "quel que soit", type: quantifier, maps_to: FORALL }
  - { phrase: "tel que",      type: connector,  maps_to: SUCH_THAT }
  - { phrase: "tels que",     type: connector,  maps_to: SUCH_THAT }
  - { phrase: "telle que",    type: connector,  maps_to: SUCH_THAT }

stop_words:
  # Mots structurels (absorbés par les patterns, pas du contenu)
  - to
  - from
  # Pronoms / déterminants
  - il
  - elle
  # Verbes conjugués
  - a
  - ai
  - as
  - avons
  - avez
  - ont
  - est
  - sont
  - etait
  - etaient
  - sera
  - seront
  - vaut
  - valent
  - donne
  - donnent
  - donc
  - alors
  - or
  - car
  - ainsi
  - ensuite

connectors:
  # Mots français neutres qui n'arrêtent pas l'expansion math.
  # "d" seul retiré : trop commun comme variable / composante en math (différentielle,
  # coordonnée). Les contractions genre "d'x" restent gérées par la ponctuation.
  - de
  - du
  - des
  - la
  - le
  - les
  - a
  - au
  - aux
  - pour
  - par
  - et
  - avec
  - sur
  - dans
  - entre
  - sous
  - vers
  - en

# Tokens spécifiques au français
tokens:

  LIMIT:
    canonical: "\\lim"
    aliases: [lim, limite, lmt]
    fuzzy_max_distance: 1

  TENDS_TO:
    canonical: "\\to"
    aliases: ["->", tend, tends, td, vrs]
    # note: "vers" retiré ; reste connector (souvent doublé avec "tend vers")

  WHEN:
    canonical: ""   # mot de liaison, pas rendu en LaTeX
    aliases: [quand, lorsque, qd, lorsqu]
    role: connector

  SQRT:
    canonical: "\\sqrt"
    aliases: [sqrt, rac, racine]
    fuzzy_max_distance: 1

  INTEGRAL:
    canonical: "\\int"
    aliases: [int, integrale, integ]
    fuzzy_max_distance: 1  # réduit à 1 pour éviter "inter" → "integ" (d=2)

  SUM:
    canonical: "\\sum"
    aliases: [sum, somme]
    fuzzy_max_distance: 1

  PRODUCT:
    canonical: "\\prod"
    aliases: [prod, produit]
    fuzzy_max_distance: 1

  VEC:
    canonical: "\\vec"
    aliases: [vec, vect, vecteur]

  IN:
    canonical: "\\in"
    aliases: [in, dans, app, appartient, "∈"]

  FORALL:
    canonical: "\\forall"
    aliases: [forall, qq, qqe]

  EXISTS:
    canonical: "\\exists"
    aliases: [exists, existe]

  SUCH_THAT:
    canonical: "\\mid"
    aliases: [tq]
    # note: "|" retiré car ambigu (PIPE / absolute_value)

  SYSTEM_KW:
    canonical: "\\begin{cases}"
    aliases: [syst, systeme]

patterns:

  # Limite sans fonction — "lim x -> inf", "lim quand x tend vers 0", etc.
  # TENDS_TO optionnel : couvre les cas où l'utilisateur ne met que "vers" (connector)
  # ou rien entre la variable et la cible.
  - id: limit_only
    description: "Limite sans fonction appliquée : juste lim x -> cible"
    # ATOM:target (pas EXPR) pour empêcher la cible d'avaler une expression entière.
    # "+inf" / "-inf" fonctionnent via l'extension unaire de FindAtomEnd.
    match: "LIMIT WHEN? IDENT:var TENDS_TO? ATOM:target"
    template: "\\lim_{{{var}} \\to {{target}}}"
    examples:
      - input: "lim x -> inf"
        output: "\\lim_{x \\to \\infty}"
      - input: "lim quand x tend vers 0"
        output: "\\lim_{x \\to 0}"
      - input: "limite x -> +inf"
        output: "\\lim_{x \\to +\\infty}"
      - input: "lim x tends vers 1"
        output: "\\lim_{x \\to 1}"

  # Limite suivie de la fonction : "lim x -> 1 f(x)" (ordre naturel français)
  # ATOM:target plutôt qu'EXPR pour ne PAS engouffrer f(x) dans la cible.
  # Priorité relevée (120) pour battre limit_only qui matcherait aussi en mettant
  # tout dans target.
  - id: limit_post_function
    description: "lim var -> target f(x) — la fonction suit la cible"
    priority: 120
    match: "LIMIT WHEN? IDENT:var TENDS_TO? ATOM:target IDENT:f LPAREN EXPR:x RPAREN"
    template: "\\lim_{{{var}} \\to {{target}}} {{f}}({{x}})"
    examples:
      - input: "lim x -> 1 f(x)"
        output: "\\lim_{x \\to 1} f(x)"
      - input: "lim x tend vers 0 f(x)"
        output: "\\lim_{x \\to 0} f(x)"

  # Limite suivie d'une EXPRESSION quelconque (pas juste un appel de fonction).
  # Ex : "lim x->0 (2x+1)/(3x+3)^2" → \lim_{x \to 0} \frac{2x+1}{(3x+3)^2}.
  # ATOM:target garde la cible atomique, EXPR:f aspire tout le reste et est
  # rendu via JoinTokens précédence-conscient.
  - id: limit_with_expr_function
    description: "lim var -> target <expression> — toute expression algébrique"
    priority: 120
    match: "LIMIT WHEN? IDENT:var TENDS_TO? ATOM:target EXPR:f"
    template: "\\lim_{{{var}} \\to {{target}}} {{f}}"
    examples:
      - input: "lim x->0 (2x+1)/(3x+3)^2"
        output: "\\lim_{x \\to 0} \\frac{2x+1}{(3x+3)^2}"
      - input: "lim x->0 x^2"
        output: "\\lim_{x \\to 0} x^2"

  # Limite à droite / gauche : lim x -> 0+ f(x), lim x -> 0- f(x)
  # Priorité 130 > limit_post_function (120) : gagne quand le signe est présent.
  # Template avec `^{{side}}` (2 accolades) et PAS `^{{{side}}}` (3) pour
  # laisser l'auto-wrap faire son travail : side="+" (1 char) → pas de wrap,
  # donc on obtient `^+` et non `^{+}`.
  - id: limit_one_sided_with_f
    description: "lim x -> 0+ f(x) / lim x -> 0- f(x)"
    priority: 130
    match: "LIMIT WHEN? IDENT:var TENDS_TO? ATOM:target (PLUS|MINUS):side EXPR:f"
    template: "\\lim_{{{var}} \\to {{target}}^{{side}}} {{f}}"
    examples:
      - input: "lim x->0+ f(x)"
        output: "\\lim_{x \\to 0^+} f(x)"
      - input: "lim x->0- f(x)"
        output: "\\lim_{x \\to 0^-} f(x)"
      - input: "lim x -> 0+ 1/x"
        output: "\\lim_{x \\to 0^+} \\frac{1}{x}"

  - id: limit_one_sided_only
    description: "lim x -> 0+ (sans fonction)"
    priority: 130
    match: "LIMIT WHEN? IDENT:var TENDS_TO? ATOM:target (PLUS|MINUS):side"
    template: "\\lim_{{{var}} \\to {{target}}^{{side}}}"
    examples:
      - input: "lim x -> 0 +"
        output: "\\lim_{x \\to 0^+}"

  # Limsup / liminf : lim sup / lim inf, version avec flèche et cible
  - id: limsup_expr
    description: "limsup x -> inf f(x)"
    priority: 120
    match: "LIMSUP IDENT:var TENDS_TO? ATOM:target EXPR:f"
    template: "\\limsup_{{{var}} \\to {{target}}} {{f}}"
    examples:
      - input: "limsup x -> inf f(x)"
        output: "\\limsup_{x \\to \\infty} f(x)"

  - id: liminf_expr
    description: "liminf n -> inf u_n"
    priority: 120
    match: "LIMINF IDENT:var TENDS_TO? ATOM:target EXPR:f"
    template: "\\liminf_{{{var}} \\to {{target}}} {{f}}"
    examples:
      - input: "liminf n -> inf u_n"
        output: "\\liminf_{n \\to \\infty} u_n"

  # Limite classique FR
  - id: limit_fr_qd
    description: "lim f(x) qd x -> a"
    match: "LIMIT IDENT:f LPAREN EXPR:x RPAREN WHEN? IDENT:var TENDS_TO? EXPR:target"
    template: "\\lim_{{{var}} \\to {{target}}} {{f}}({{x}})"
    examples:
      - input: "lim f(x) qd x -> 1"
        output: "\\lim_{x \\to 1} f(x)"
      - input: "lim f(x) quand x tend vers 1"
        output: "\\lim_{x \\to 1} f(x)"
      - input: "limite f(x) x -> +inf"
        output: "\\lim_{x \\to +\\infty} f(x)"
      - input: "lmt fx qd x td 1"
        output: "\\lim_{x \\to 1} f(x)"
        skip: "pattern exige les parens autour de l'argument"

  - id: limit_fr_en_point
    description: "limite de f en a"
    match: "LIMIT de? IDENT:f en IDENT:target"
    template: "\\lim_{{{target}}} {{f}}"
    examples:
      - input: "limite de f en 0"
        output: "\\lim_{0} f"

  # Ambigu : "3sqrt(4)" ou "3 sqrt(4)" peut signifier :
  #   - 3 × √4           → 3\sqrt{4}   (multiplication implicite, cas le plus courant)
  #   - racine cubique(4) → \sqrt[3]{4} (racine n-ième, moins fréquent)
  # On propose les DEUX en top-k, priorité multiplication légèrement plus haute.
  - id: number_times_sqrt
    description: "3 sqrt(4) / 3sqrt(4) → 3 × √(4) — multiplication implicite"
    priority: 60
    match: "NUMBER:n SQRT LPAREN EXPR:arg RPAREN"
    template: "{{n}} \\sqrt{{{arg}}}"
    examples:
      - input: "3 sqrt(4)"
        output: "3 \\sqrt{4}"
      - input: "3sqrt(4)"
        output: "3 \\sqrt{4}"

  - id: nth_root_prefix
    description: "3sqrt(4) → racine cubique de 4 (alternative)"
    priority: 55
    match: "NUMBER:n SQRT LPAREN EXPR:arg RPAREN"
    template: "\\sqrt[{{n}}]{{{arg}}}"
    examples:
      - input: "3sqrt(4)"
        output: "\\sqrt[3]{4}"

  # Notation LaTeX-like explicite : "sqrt[3](4)" → √[3]{4} (racine n-ième sans ambiguïté)
  - id: nth_root_bracket
    description: "sqrt[3](4) → racine n-ième (notation LaTeX)"
    priority: 70
    match: "SQRT LBRACKET NUMBER:n RBRACKET LPAREN EXPR:arg RPAREN"
    template: "\\sqrt[{{n}}]{{{arg}}}"
    examples:
      - input: "sqrt[3](4)"
        output: "\\sqrt[3]{4}"

  # Racine carrée FR
  - id: sqrt_fr
    description: "Racine carrée, plusieurs syntaxes FR"
    match: "SQRT LPAREN? EXPR:x RPAREN?"
    template: "\\sqrt{{{x}}}"
    examples:
      - input: "sqrt(2)"
        output: "\\sqrt{2}"
      - input: "rac(x+1)"
        output: "\\sqrt{x+1}"
      - input: "racine de 2"
        output: "\\sqrt{2}"
      - input: "V(x+1)"
        output: "\\sqrt{x+1}"
        skip: "V ambigu avec variance — nécessite analyse contextuelle"

  # Vecteur FR
  - id: vector_fr
    description: "Vecteur"
    match: "VEC LPAREN? IDENT:name RPAREN?"
    template: "\\vec{{{name}}}"
    examples:
      - input: "vec AB"
        output: "\\vec{AB}"
      - input: "vec(u)"
        output: "\\vec{u}"
      - input: "vecteur AB"
        output: "\\vec{AB}"

  # Intégrale FR
  - id: integral_fr_bounds
    description: "Intégrale de a à b de f(x) dx"
    match: "INTEGRAL de? EXPR:a a EXPR:b de? EXPR:f dx?"
    template: "\\int_{{{a}}}^{{{b}}} {{f}} \\, dx"
    examples:
      - input: "int de 0 a 1 de x^2 dx"
        output: "\\int_{0}^{1} x^2 \\, dx"
      - input: "integrale de 0 a pi de sin(x) dx"
        output: "\\int_{0}^{\\pi} \\sin(x) \\, dx"
      - input: "int de 0 a 1 x^2"
        output: "\\int_{0}^{1} x^2 \\, dx"
      - input: "int 0 a 1 x^2"
        output: "\\int_{0}^{1} x^2 \\, dx"

  # Intégrale indéfinie : juste "int f dx" ou "int f"
  - id: integral_fr_indef
    description: "Intégrale indéfinie sans bornes"
    match: "INTEGRAL de? EXPR:f dx?"
    template: "\\int {{f}} \\, dx"
    examples:
      - input: "int x^2 dx"
        output: "\\int x^2 \\, dx"
      - input: "int x^2"
        output: "\\int x^2 \\, dx"
      - input: "integrale de sin(x)"
        output: "\\int \\sin(x) \\, dx"

  # Quantificateurs FR
  - id: forall_fr
    description: "Pour tout x dans E"
    match: "FORALL IDENT:var IN EXPR:set"
    template: "\\forall {{var}} \\in {{set}}"
    examples:
      - input: "pour tout x in R"
        output: "\\forall x \\in \\mathbb{R}"
      - input: "qq x dans R"
        output: "\\forall x \\in \\mathbb{R}"

  # Raccourci ultra-court : "Vx(R" ou "Vx C R" = pour tout x appartient à R
  # VX_SHORT matche un IDENT de forme "V" + 1 lettre minuscule (Vx, Vy, Vt…)
  # et son rendu strippe le préfixe V. "(" et "C" remplacent tous deux "∈" par
  # convention rapide au clavier.
  - id: forall_shorthand_V
    description: "Vx(R / Vx C R → pour tout x ∈ R (notation rapide collée)"
    match: "VX_SHORT:var (LPAREN|c) SET_ATOM:set RPAREN?"
    template: "\\forall {{var}} \\in {{set}}"
    examples:
      - input: "Vx(R"
        output: "\\forall x \\in \\mathbb{R}"
      - input: "Vx(R*"
        output: "\\forall x \\in \\mathbb{R}^*"
      - input: "Vx C R"
        output: "\\forall x \\in \\mathbb{R}"

  # Variante compacte 2 variables : "Vx,y(R" → ∀ x, y ∈ R
  - id: forall_shorthand_Vxy_compact
    description: "Vx,y(R / Vx,y C R → pour tout x, y ∈ R (compact, 2 variables)"
    priority: 55
    match: "VX_SHORT:var1 COMMA IDENT:var2 (LPAREN|c) SET_ATOM:set RPAREN?"
    template: "\\forall {{var1}}, {{var2}} \\in {{set}}"
    examples:
      - input: "Vx,y(R"
        output: "\\forall x, y \\in \\mathbb{R}"
      - input: "Vx,y(R*"
        output: "\\forall x, y \\in \\mathbb{R}^*"
      - input: "Vx,y C R"
        output: "\\forall x, y \\in \\mathbb{R}"

  # Unifié "V <liste> ( <intervalle>" → ∀ <vars> ∈ <intervalle>
  # LIST_PARAMS : 1-N idents séparés par virgule/espace, éventuellement entre parens.
  # INTERVAL : ensemble simple (R, R*, R-{0}) ou intervalle ([0;1], [0;1]U[3;4]).
  # Couvre : V x ( R, V x,y ( R, V x, y ( R+, V (x,y,z) ( R, V x y ( R*, V x ( [0;1]U[3;4]
  - id: forall_shorthand_unified_spaced
    description: "V <liste> ( <intervalle> ou V <liste> C <intervalle> → ∀ <vars> ∈ <intervalle>"
    priority: 55
    match: "VAR LIST_PARAMS:vars (LPAREN|c) INTERVAL:set RPAREN?"
    template: "\\forall {{vars}} \\in {{set}}"
    examples:
      - input: "V x ( R"
        output: "\\forall x \\in \\mathbb{R}"
      - input: "V x(R"
        output: "\\forall x \\in \\mathbb{R}"
      - input: "V x C R"
        output: "\\forall x \\in \\mathbb{R}"
      - input: "V n ( N"
        output: "\\forall n \\in \\mathbb{N}"
      - input: "V x ( R*"
        output: "\\forall x \\in \\mathbb{R}^*"
      - input: "V x ( R-{0}"
        output: "\\forall x \\in \\mathbb{R} \\setminus \\{0\\}"
      - input: "V x,y ( R"
        output: "\\forall x, y \\in \\mathbb{R}"
      - input: "V x, y ( R+"
        output: "\\forall x, y \\in \\mathbb{R}^+"
      - input: "V x,y,z ( R"
        output: "\\forall x, y, z \\in \\mathbb{R}"
      - input: "V x,y C R"
        output: "\\forall x, y \\in \\mathbb{R}"
      - input: "V x ( [0;1]"
        output: "\\forall x \\in [0, 1]"
      - input: "V x ( [0;1]U[3;4]"
        output: "\\forall x \\in [0, 1] \\cup [3, 4]"

  # V seul suivi d'un ident → ∀ ident (sans ensemble)
  - id: forall_only_V_spaced
    description: "V x → pour tout x (sans ensemble)"
    priority: 50
    match: "VAR IDENT:var"
    template: "\\forall {{var}}"
    examples:
      - input: "V x"
        output: "\\forall x"

  # Raccourci "courbe de f" : Cf, Cg, Ch → \mathcal{C}_f, \mathcal{C}_g, \mathcal{C}_h
  # Convention française lycée : Cf = courbe représentative de la fonction f.
  - id: curve_shorthand
    description: "Cf → courbe de la fonction f (mathcal C subscript f)"
    priority: 50
    match: "CF_SHORT:name"
    template: "\\mathcal{C}_{{{name}}}"
    examples:
      - input: "Cf"
        output: "\\mathcal{C}_{f}"
      - input: "Cg"
        output: "\\mathcal{C}_{g}"

  # Raccourci "ensemble de définition" : Df, Dg, Dh → D_f, D_g, D_h
  # Convention française lycée : Df = ensemble de définition de la fonction f.
  - id: domain_shorthand
    description: "Df → ensemble de définition de f (D indice f)"
    priority: 50
    match: "DF_SHORT:name"
    template: "D_{{{name}}}"
    examples:
      - input: "Df"
        output: "D_{f}"
      - input: "Dg"
        output: "D_{g}"

  # Unifié "<liste> ( <intervalle>" ou "<liste> C <intervalle>" → <vars> ∈ <intervalle>
  # Couvre : x ( R, x C R, x,y ( R, x y ( R*, (x,y,z) ( R, x ( [0;1], x ( [0;1]U[3;4]
  - id: belongs_shorthand_unified
    description: "<liste> ( <intervalle> ou <liste> C <intervalle> → <vars> ∈ <intervalle>"
    priority: 55
    match: "LIST_PARAMS:vars (LPAREN|c) INTERVAL:set RPAREN?"
    template: "{{vars}} \\in {{set}}"
    examples:
      - input: "x ( R"
        output: "x \\in \\mathbb{R}"
      - input: "x(R"
        output: "x \\in \\mathbb{R}"
      - input: "x C R"
        output: "x \\in \\mathbb{R}"
      - input: "x ( R*"
        output: "x \\in \\mathbb{R}^*"
      - input: "x ( R-{0}"
        output: "x \\in \\mathbb{R} \\setminus \\{0\\}"
      - input: "x,y ( R"
        output: "x, y \\in \\mathbb{R}"
      - input: "x, y ( R*"
        output: "x, y \\in \\mathbb{R}^*"
      - input: "x,y C R"
        output: "x, y \\in \\mathbb{R}"
      - input: "x ( [0;1]"
        output: "x \\in [0, 1]"
      - input: "x ( [0;1]U[3;4]"
        output: "x \\in [0, 1] \\cup [3, 4]"

  - id: exists_fr
    description: "Il existe x tel que"
    match: "EXISTS IDENT:var SUCH_THAT? EXPR:cond"
    template: "\\exists {{var}} \\mid {{cond}}"
    examples:
      - input: "il existe alpha tq alpha > 0"
        output: "\\exists \\alpha \\mid \\alpha > 0"

  # Appartenance FR
  - id: belongs_to_fr
    description: "x appartient à E"
    match: "IDENT:x IN EXPR:set"
    template: "{{x}} \\in {{set}}"
    examples:
      - input: "x in R"
        output: "x \\in \\mathbb{R}"
      - input: "x dans R"
        output: "x \\in \\mathbb{R}"

  # Système d'équations FR
  - id: system_fr
    description: "Système d'équations"
    match: "SYSTEM_KW EQUATION_LIST:eqs"
    template: "\\begin{cases} {{eqs}} \\end{cases}"
    examples:
      - input: "syst x+y=5 ; 2x-y=1"
        output: "\\begin{cases} x+y=5 \\\\ 2x-y=1 \\end{cases}"
      - input: "systeme x+y=5, 2x-y=1"
        output: "\\begin{cases} x+y=5 \\\\ 2x-y=1 \\end{cases}"

# Analyse FR — dérivées, équations différentielles, primitives

domain: analysis
language: fr
version: 1
depends_on: [core, shared, fr_language]
priority: 100

tokens:

  DERIV_KW:
    canonical: ""
    aliases: [derivee, deriv, derivée]
    fuzzy_max_distance: 1
    role: semantic

  PRIMITIVE_KW:
    canonical: ""
    aliases: [primitive, primit]
    fuzzy_max_distance: 1
    role: semantic

patterns:

  # Dérivée en notation physique
  - id: derivative_leibniz
    description: "Dérivée dy/dx"
    match: "d IDENT:y DIV d IDENT:x"
    template: "\\frac{d{{y}}}{d{{x}}}"
    examples:
      - input: "df/dx"
        output: "\\frac{df}{dx}"
      - input: "dy/dt"
        output: "\\frac{dy}{dt}"

  # Dérivée seconde
  - id: derivative_second_prime
    description: "f''(x)"
    match: "IDENT:f PRIME PRIME LPAREN EXPR:x RPAREN"
    template: "{{f}}''({{x}})"
    examples:
      - input: "f''(x)"
        output: "f''(x)"
      - input: "f\"(x)"
        output: "f''(x)"

  # Équation différentielle simple
  - id: ode_first_order
    description: "y' = ky"
    match: "IDENT:y PRIME EQ EXPR:rhs"
    template: "{{y}}' = {{rhs}}"
    examples:
      - input: "y' = ky"
        output: "y' = ky"
      - input: "f'(x) = 2x"
        output: "f'(x) = 2x"

  # ============================================================
  # Opérateurs structurés : Sum, Product, Integral avec bornes
  # Plusieurs formats de saisie acceptés.
  # ============================================================

  # Sum k=1 to N f(k)  ou  Sum k=1 a N f(k)
  - id: sum_eq_to_summand
    description: "Sum k=1 to 10 f(k) — format borne basse = / borne haute avec 'to' ou 'a'"
    priority: 110
    match: "SUM IDENT:var EQ ATOM:lower (to|a) ATOM:upper EXPR:summand"
    template: "\\sum_{{{var}}={{lower}}}^{{{upper}}} {{summand}}"
    examples:
      - input: "Sum k=1 to 10 f(k)"
        output: "\\sum_{k=1}^{10} f(k)"
      - input: "sum k=1 a n f(k)"
        output: "\\sum_{k=1}^{n} f(k)"

  # Sum k=1 k<N f(k) — borne haute via inégalité
  - id: sum_eq_cmp_summand
    description: "Sum k=1 k<10 f(k) — borne haute via k<N (on ignore var2 et op)"
    priority: 110
    match: "SUM IDENT:var EQ ATOM:lower IDENT:var2 (LT|LEQ|GT|GEQ):op ATOM:upper EXPR:summand"
    template: "\\sum_{{{var}}={{lower}}}^{{{upper}}} {{summand}}"
    examples:
      - input: "Sum k=1 k<10 f(k)+1"
        output: "\\sum_{k=1}^{10} f(k)+1"

  # Sum(k,1,10) f(k) — style Mathematica 3 args
  - id: sum_paren_3args
    description: "Sum(k,1,10) f(k) — style Mathematica 3 arguments"
    priority: 110
    match: "SUM LPAREN IDENT:var COMMA ATOM:lower COMMA ATOM:upper RPAREN EXPR:summand"
    template: "\\sum_{{{var}}={{lower}}}^{{{upper}}} {{summand}}"
    examples:
      - input: "Sum(k,1,10) f(k)"
        output: "\\sum_{k=1}^{10} f(k)"

  # Sum k 1 n f(k) — séparateur espace, pas de "=" ni "to"/"a".
  # Analogue à `lim x 0 f(x)` qui marche grâce à TENDS_TO optionnel.
  # Priorité 100 (< 110) : les variantes explicites (= et to/a) gagnent si applicables.
  - id: sum_space_separated
    description: "Sum k 1 n f(k) — bornes séparées par espaces, sans = ni to"
    priority: 100
    match: "SUM IDENT:var ATOM:lower ATOM:upper EXPR:summand"
    template: "\\sum_{{{var}}={{lower}}}^{{{upper}}} {{summand}}"
    examples:
      - input: "Sum k 1 n f(k)"
        output: "\\sum_{k=1}^{n} f(k)"
      - input: "somme k 1 10 k^2"
        output: "\\sum_{k=1}^{10} k^2"

  # Product — mêmes formats
  - id: product_eq_to_factor
    priority: 110
    match: "PRODUCT IDENT:var EQ ATOM:lower (to|a) ATOM:upper EXPR:factor"
    template: "\\prod_{{{var}}={{lower}}}^{{{upper}}} {{factor}}"
    examples:
      - input: "prod k=1 to n f(k)"
        output: "\\prod_{k=1}^{n} f(k)"
      - input: "produit k=1 a 10 k"
        output: "\\prod_{k=1}^{10} k"

  - id: product_paren_3args
    priority: 110
    match: "PRODUCT LPAREN IDENT:var COMMA ATOM:lower COMMA ATOM:upper RPAREN EXPR:factor"
    template: "\\prod_{{{var}}={{lower}}}^{{{upper}}} {{factor}}"
    examples:
      - input: "prod(k,1,n) k"
        output: "\\prod_{k=1}^{n} k"

  - id: product_space_separated
    description: "prod k 1 n k^2 — bornes séparées par espaces"
    priority: 100
    match: "PRODUCT IDENT:var ATOM:lower ATOM:upper EXPR:factor"
    template: "\\prod_{{{var}}={{lower}}}^{{{upper}}} {{factor}}"
    examples:
      - input: "prod k 1 n k"
        output: "\\prod_{k=1}^{n} k"

  # Integral — format 3 args avec "to" ou "a"
  - id: integral_eq_to
    description: "int a=0 to 1 f(x) dx — borne basse / borne haute explicites"
    priority: 110
    match: "INTEGRAL ATOM:lower (to|a) ATOM:upper EXPR:f dx?"
    template: "\\int_{{{lower}}}^{{{upper}}} {{f}} \\, dx"
    examples:
      - input: "int 0 to 1 x^2 dx"
        output: "\\int_{0}^{1} x^2 \\, dx"
      - input: "integrale 0 a pi sin(x)"
        output: "\\int_{0}^{\\pi} \\sin(x) \\, dx"

  - id: integral_paren_3args
    description: "int(x,0,1) f(x) — style Mathematica"
    priority: 110
    match: "INTEGRAL LPAREN IDENT:var COMMA ATOM:lower COMMA ATOM:upper RPAREN EXPR:f"
    template: "\\int_{{{lower}}}^{{{upper}}} {{f}} \\, d{{var}}"
    examples:
      - input: "int(x,0,1) x^2"
        output: "\\int_{0}^{1} x^2 \\, dx"

  - id: integral_space_separated
    description: "int 0 1 f(x) dx — bornes séparées par espaces, sans to/a"
    priority: 100
    match: "INTEGRAL ATOM:lower ATOM:upper EXPR:f dx?"
    template: "\\int_{{{lower}}}^{{{upper}}} {{f}} \\, dx"
    examples:
      - input: "int 0 1 x^2 dx"
        output: "\\int_{0}^{1} x^2 \\, dx"
      - input: "integrale 0 pi sin(x)"
        output: "\\int_{0}^{\\pi} \\sin(x) \\, dx"

  # Limit format natural : "lim x -> a f(x)" (déjà couvert par limit_post_function)
  # Limit style Mathematica : Lim(x, a) f(x)
  - id: limit_paren_2args
    description: "Lim(x,a) f(x) — style Mathematica"
    priority: 110
    match: "LIMIT LPAREN IDENT:var COMMA ATOM:target RPAREN EXPR:f"
    template: "\\lim_{{{var}} \\to {{target}}} {{f}}"
    examples:
      - input: "Lim(x,0) f(x)"
        output: "\\lim_{x \\to 0} f(x)"
      - input: "lim(n,+inf) 1/n"
        output: "\\lim_{n \\to +\\infty} \\frac{1}{n}"

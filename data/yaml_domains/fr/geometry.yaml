# Géométrie FR — vecteurs, normes, angles, longueurs

domain: geometry
language: fr
version: 1
depends_on: [core, shared, fr_language]
priority: 100

patterns:

  # Addition de vecteurs
  - id: vector_addition
    description: "Somme de vecteurs avec notation Chasles"
    match: "VEC IDENT:a PLUS VEC IDENT:b"
    template: "\\vec{{{a}}} + \\vec{{{b}}}"
    examples:
      - input: "vec AB + vec BC"
        output: "\\vec{AB} + \\vec{BC}"

  # Produit scalaire
  - id: dot_product
    description: "Produit scalaire vec u . vec v"
    match: "VEC IDENT:u TIMES VEC IDENT:v"
    template: "\\vec{{{u}}} \\cdot \\vec{{{v}}}"
    examples:
      - input: "vec u . vec v"
        output: "\\vec{u} \\cdot \\vec{v}"

  # Longueur (norme d'un segment)
  - id: segment_length
    description: "Longueur AB d'un segment"
    match: "IDENT_UPPER_PAIR:name EQ EXPR:val"
    template: "{{name}} = {{val}}"
    examples:
      - input: "AB = 5"
        output: "AB = 5"

  # Unité géométrique atomique — l'utilisateur tape juste "AB". On propose
  # en parallèle les trois lectures possibles : littérale, vectorielle, norme.
  # L'ambiguïté est résolue par la popup (l'utilisateur choisit).
  - id: unit_literal
    description: "Identifiant géométrique tel quel (segment, point, longueur implicite)"
    match: "IDENT_UPPER_PAIR:name"
    template: "{{name}}"
    examples:
      - input: "AB"
        output: "AB"

  - id: unit_vector
    description: "Identifiant géométrique lu comme vecteur"
    match: "IDENT_UPPER_PAIR:name"
    template: "\\vec{{{name}}}"
    examples:
      - input: "AB"
        output: "\\vec{AB}"

  - id: unit_norm
    description: "Identifiant géométrique lu comme norme / longueur"
    match: "IDENT_UPPER_PAIR:name"
    template: "\\|{{name}}\\|"
    examples:
      - input: "AB"
        output: "\\|AB\\|"

  # Angle ABC : trois lettres majuscules avec sommet au milieu (lettre B ici).
  # Notation FR : ABĈ lu comme l'angle au sommet B entre [BA) et [BC).
  # IDENT_UPPER_TRIPLE exige EXACTEMENT 3 lettres — les paires "AB" ne
  # déclenchent pas ce pattern (pas d'angle à 2 points).
  - id: unit_angle
    description: "ABC (3 lettres majuscules) lu comme angle au sommet central"
    match: "IDENT_UPPER_TRIPLE:name"
    template: "\\widehat{{{name}}}"
    examples:
      - input: "ABC"
        output: "\\widehat{ABC}"

  # Relation de Chasles — interprétation vecteurs
  # Priorité 50 (< equation_simple prio 100) : l'interprétation littérale reste en
  # tête, Chasles apparaît comme alternative pour qui la veut.
  - id: chasles_vectors
    description: "Relation de Chasles lue comme somme de vecteurs"
    priority: 50
    match: "IDENT_UPPER_PAIR:a PLUS IDENT_UPPER_PAIR:b EQ IDENT_UPPER_PAIR:c"
    template: "\\vec{{{a}}} + \\vec{{{b}}} = \\vec{{{c}}}"
    examples:
      - input: "AB+BC=AC"
        output: "\\vec{AB} + \\vec{BC} = \\vec{AC}"

  # Relation de Chasles — interprétation longueurs / normes
  - id: chasles_norms
    description: "Relation de Chasles lue comme somme de normes / longueurs"
    priority: 50
    match: "IDENT_UPPER_PAIR:a PLUS IDENT_UPPER_PAIR:b EQ IDENT_UPPER_PAIR:c"
    template: "\\|{{a}}\\| + \\|{{b}}\\| = \\|{{c}}\\|"
    examples:
      - input: "AB+BC=AC"
        output: "\\|AB\\| + \\|BC\\| = \\|AC\\|"

  # Produit scalaire atomique — "AB.BC" lu comme produit scalaire des vecteurs
  - id: dot_product_atomic
    description: "Produit scalaire entre deux vecteurs notés en lettres majuscules"
    match: "IDENT_UPPER_PAIR:a TIMES IDENT_UPPER_PAIR:b"
    template: "\\vec{{{a}}} \\cdot \\vec{{{b}}}"
    examples:
      - input: "AB.BC"
        output: "\\vec{AB} \\cdot \\vec{BC}"

  # Produit vectoriel atomique — "AB^BC" lu comme produit vectoriel (convention FR : wedge)
  - id: cross_product_atomic
    description: "Produit vectoriel entre deux vecteurs notés en lettres majuscules"
    match: "IDENT_UPPER_PAIR:a POWER IDENT_UPPER_PAIR:b"
    template: "\\vec{{{a}}} \\wedge \\vec{{{b}}}"
    examples:
      - input: "AB^BC"
        output: "\\vec{AB} \\wedge \\vec{BC}"

  # Vecteur avec composantes 2D — "u(x,y)" ou "u(x y)" (virgule OU espace).
  # ATOM pour x et y (au lieu d'EXPR greedy), COMMA optionnelle.
  # Priorité basse (5) : interprétation ALTERNATIVE, function_call reste en tête.
  # Rendu via \binom (supporté par WPF-Math, visuel = vecteur colonne).
  - id: vector_components_2d
    description: "u(x,y) ou u(x y) lu comme vecteur avec composantes empilées (2D)"
    priority: 5
    match: "IDENT:u LPAREN ATOM:x COMMA? ATOM:y RPAREN"
    template: "\\vec{{{u}}} \\binom{{{x}}}{{{y}}}"
    examples:
      - input: "u(x,y)"
        output: "\\vec{u} \\binom{x}{y}"
      - input: "u(x y)"
        output: "\\vec{u} \\binom{x}{y}"

  # Variante avec identifiant géométrique : "AB(x,y)" / "AB(x y)"
  - id: vector_components_2d_upper
    description: "AB(x,y) ou AB(x y) lu comme vecteur AB avec composantes"
    priority: 5
    match: "IDENT_UPPER_PAIR:u LPAREN ATOM:x COMMA? ATOM:y RPAREN"
    template: "\\vec{{{u}}} \\binom{{{x}}}{{{y}}}"
    examples:
      - input: "AB(x,y)"
        output: "\\vec{AB} \\binom{x}{y}"
      - input: "AB(x y)"
        output: "\\vec{AB} \\binom{x}{y}"

  # Vecteur avec composantes 3D — "u(x,y,z)" / "u(x y z)". \binom limité à 2 args,
  # donc nested : \binom{x}{\binom{y}{z}} → rendu en pile 3.
  - id: vector_components_3d
    description: "u(x,y,z) ou u(x y z) lu comme vecteur avec composantes empilées (3D)"
    priority: 5
    match: "IDENT:u LPAREN ATOM:x COMMA? ATOM:y COMMA? ATOM:z RPAREN"
    template: "\\vec{{{u}}} \\binom{{{x}}}{\\binom{{{y}}}{{{z}}}}"
    examples:
      - input: "u(x,y,z)"
        output: "\\vec{u} \\binom{x}{\\binom{y}{z}}"
      - input: "u(x y z)"
        output: "\\vec{u} \\binom{x}{\\binom{y}{z}}"

  # Variante 3D avec identifiant géométrique
  - id: vector_components_3d_upper
    description: "AB(x,y,z) ou AB(x y z) lu comme vecteur AB avec 3 composantes"
    priority: 5
    match: "IDENT_UPPER_PAIR:u LPAREN ATOM:x COMMA? ATOM:y COMMA? ATOM:z RPAREN"
    template: "\\vec{{{u}}} \\binom{{{x}}}{\\binom{{{y}}}{{{z}}}}"
    examples:
      - input: "AB(x y z)"
        output: "\\vec{AB} \\binom{x}{\\binom{y}{z}}"

  # Scalaire × vecteur — "λu", "2u", "-u" lu comme λ·vec(u), 2·vec(u), -vec(u).
  # Interprétation ALTERNATIVE : top-k coexistant avec lecture littérale.
  # Matche seulement sur 2 tokens adjacents (via HadSpaceBefore faux sur le 2e).
  - id: scalar_times_vector
    description: "λu / 2u → \\lambda \\vec{u} / 2 \\vec{u} (alt lecture vectorielle)"
    priority: 5
    match: "(LAMBDA|MU|ALPHA|BETA|IDENT|NUMBER):scalar IDENT:vec"
    template: "{{scalar}} \\vec{{{vec}}}"
    examples:
      - input: "λu"
        output: "\\lambda \\vec{u}"
      - input: "2u"
        output: "2 \\vec{u}"

  # Déterminant bilinéaire : det(u, v) / Det(u ; v) → det vectoriel.
  # Séparateur , ou ; au choix (le cours français utilise souvent ;).
  - id: determinant_2vec
    description: "det(u ; v) / Det(u, v) → \\det(\\vec{u}, \\vec{v})"
    priority: 100
    match: "DET_KW LPAREN IDENT:u (SEMICOLON|COMMA) IDENT:v RPAREN"
    template: "\\det(\\vec{{{u}}}, \\vec{{{v}}})"
    tokens_inline:
      DET_KW: { aliases: [det, Det], canonical: "\\det" }
    examples:
      - input: "det(u, v)"
        output: "\\det(\\vec{u}, \\vec{v})"
      - input: "Det(u ; v)"
        output: "\\det(\\vec{u}, \\vec{v})"

  # Déterminant avec identifiants 2-lettres majuscules (Det(AM ; u))
  - id: determinant_2vec_upper
    description: "Det(AM ; u) → \\det(\\vec{AM}, \\vec{u})"
    priority: 100
    match: "DET_KW LPAREN IDENT_UPPER_PAIR:u (SEMICOLON|COMMA) IDENT:v RPAREN"
    template: "\\det(\\vec{{{u}}}, \\vec{{{v}}})"
    examples:
      - input: "Det(AM ; u)"
        output: "\\det(\\vec{AM}, \\vec{u})"

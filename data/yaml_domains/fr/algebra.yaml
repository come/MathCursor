# Algèbre FR — équations, polynômes, systèmes, factorisation

domain: algebra
language: fr
version: 1
depends_on: [core, shared, fr_language]
priority: 100

patterns:

  # Équation classique
  - id: equation_simple
    description: "Égalité générique"
    match: "EXPR:lhs EQ EXPR:rhs"
    template: "{{lhs}} = {{rhs}}"
    examples:
      - input: "x + y = 5"
        output: "x + y = 5"
      - input: "2x - 3 = 0"
        output: "2x - 3 = 0"

  # Inégalité
  - id: inequality
    description: "Inégalité stricte ou large"
    match: "EXPR:lhs (LT|LEQ|GT|GEQ):op EXPR:rhs"
    template: "{{lhs}} {{op}} {{rhs}}"
    examples:
      - input: "x^2 >= 0"
        output: "x^2 \\geq 0"
      - input: "x < 2"
        output: "x < 2"

  # Équation du second degré factorisée
  - id: factored_quadratic
    description: "(x-a)(x-b) forme factorisée"
    match: "LPAREN EXPR:a RPAREN LPAREN EXPR:b RPAREN"
    template: "({{a}})({{b}})"
    examples:
      - input: "(x-1)(x+2)"
        output: "(x-1)(x+2)"

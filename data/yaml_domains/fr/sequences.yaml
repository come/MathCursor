# Suites FR — notation un, récurrence, convergence

domain: sequences
language: fr
version: 1
depends_on: [core, shared, fr_language]
priority: 100

patterns:

  # Suite notée un (fusion visuelle)
  - id: sequence_un_compact
    description: "Suite écrite un, vn, wn sans underscore"
    match: "IDENT_SEQ:name"
    template: "{{name}}_n"
    conditions:
      - "IDENT matches /^[uvwstUVW]n$/"
    examples:
      - input: "un"
        output: "u_n"
      - input: "vn"
        output: "v_n"

  # Suite avec parenthèses (un)
  - id: sequence_with_parens
    description: "Suite (un)"
    match: "LPAREN IDENT_SEQ:name RPAREN"
    template: "({{name}}_n)"
    examples:
      - input: "(un)"
        output: "(u_n)"

  # Récurrence u(n+1) = ...
  - id: recurrence
    description: "Relation de récurrence"
    match: "IDENT:u LPAREN IDENT:n PLUS NUMBER:k RPAREN EQ EXPR:rhs"
    template: "{{u}}_{{{n}}+{{k}}} = {{rhs}}"
    examples:
      - input: "u(n+1) = 2*un + 3"
        output: "u_{n+1} = 2 \\cdot u_n + 3"

  # Convergence
  - id: sequence_limit
    description: "(un) converge vers L"
    match: "LPAREN IDENT_SEQ:name RPAREN converge vers EXPR:L"
    template: "({{name}}_n) \\to {{L}}"
    examples:
      - input: "(un) converge vers 0"
        output: "(u_n) \\to 0"

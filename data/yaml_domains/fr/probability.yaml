# Probabilités FR — P(A), espérance, variance, lois

domain: probability
language: fr
version: 1
depends_on: [core, shared, fr_language]
priority: 100

tokens:

  PROBA:
    canonical: "P"
    aliases: [P, Pr, proba]

  ESP:
    canonical: "E"
    aliases: [E, esp, esperance]

  VAR:
    canonical: "V"
    aliases: [V, var, variance]

  # INTER et UNION déplacés dans shared/symbolic.yaml (language-agnostic).

patterns:

  - id: probability_event
    description: "P(A) probabilité d'un événement"
    match: "PROBA LPAREN EXPR:event RPAREN"
    template: "P({{event}})"
    examples:
      - input: "P(A)"
        output: "P(A)"
      - input: "proba(A)"
        output: "P(A)"

  - id: probability_intersection
    description: "P(A inter B)"
    match: "PROBA LPAREN EXPR:a INTER EXPR:b RPAREN"
    template: "P({{a}} \\cap {{b}})"
    examples:
      - input: "P(A inter B)"
        output: "P(A \\cap B)"

  - id: conditional_probability
    description: "P(A|B) probabilité conditionnelle"
    match: "PROBA LPAREN EXPR:a PIPE EXPR:b RPAREN"
    template: "P({{a}} \\mid {{b}})"
    examples:
      - input: "P(A|B)"
        output: "P(A \\mid B)"

  - id: expectation
    description: "E(X) espérance"
    match: "ESP LPAREN EXPR:x RPAREN"
    template: "E({{x}})"
    examples:
      - input: "E(X)"
        output: "E(X)"
      - input: "esperance(X)"
        output: "E(X)"

  - id: variance
    description: "V(X) variance"
    match: "VAR LPAREN EXPR:x RPAREN"
    template: "V({{x}})"
    examples:
      - input: "V(X)"
        output: "V(X)"

  # Lecture alternative V(...) = racine carrée (notation d'antan).
  # V(X) reste prioritairement lu en variance ; V(x+1) a peu de sens en variance
  # donc la racine carrée apparaît comme alternative.
  - id: sqrt_as_V
    description: "V(...) lu comme racine carrée — alternative à variance"
    priority: 50
    match: "VAR LPAREN EXPR:x RPAREN"
    template: "\\sqrt{{{x}}}"
    examples:
      - input: "V(x+1)"
        output: "\\sqrt{x+1}"

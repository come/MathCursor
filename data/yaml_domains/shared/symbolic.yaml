# Shared — patterns language-agnostic
# Ne contiennent pas de mots naturels, fonctionnent en FR et EN.

domain: shared
version: 1
description: "Fonctions, puissances, fractions, structures purement symboliques"
depends_on: [core]
priority: 10

patterns:

  # Catch-all : absorbe l'input entier et laisse JoinTokens le rendre avec
  # précédence (\frac pour /, ^ pour puissance, \sqrt{} pour sqrt(...), etc.).
  # Priorité 1 — les patterns spécifiques gagnent toujours sur celui-ci, mais
  # quand ils ne matchent que partiellement, le catch-all assure qu'on ne perd
  # pas les tokens en queue (ex. "1/V(x)+1" → garde le "+1").
  - id: generic_expression
    description: "Fallback générique — rendu direct par JoinTokens"
    priority: 1
    match: "EXPR:full"
    template: "{{full}}"

  # Somme de deux expressions : délègue à la récursion pour chaque moitié.
  # Permet aux patterns spécifiques (vector_components, etc.) de s'appliquer
  # sur chaque opérande. Ex : "AB(u v) + AC(d x)" → 2 candidats (litéral OU
  # vecteur des deux côtés, via le multi-rendu à index consistant).
  - id: additive_expression
    description: "Somme de deux expressions : <expr> + <expr>"
    priority: 5
    match: "EXPR:a PLUS EXPR:b"
    template: "{{a}} + {{b}}"
    examples:
      - input: "AB(u v) + AC(d x)"
        output: "AB(u v) + AC(d x)"

  # Soustraction de deux expressions
  - id: subtractive_expression
    description: "Différence de deux expressions : <expr> - <expr>"
    priority: 5
    match: "EXPR:a MINUS EXPR:b"
    template: "{{a}} - {{b}}"
    examples:
      - input: "f(x) - g(x)"
        output: "f(x) - g(x)"

  # Puissance avec étoile : A^*, V^* → A^*, V^* (dual, conjugué)
  # Nécessaire car '*' = TIMES n'est pas un ATOM, donc power_simple rate.
  - id: power_star
    description: "A^* : puissance avec étoile (dual, conjugué)"
    priority: 15
    match: "ATOM:base POWER TIMES"
    template: "{{base}}^*"
    examples:
      - input: "A^*"
        output: "A^*"

  # Puissance
  # ATOM pour base ET exp : force la précédence mathématique correcte.
  # Évite que "1/sqrt(x)^2" soit lu comme "(1/sqrt(x))^2".
  - id: power_simple
    description: "Puissance avec exposant atomique"
    match: "ATOM:base POWER ATOM:exp"
    template: "{{base}}^{{exp}}"
    examples:
      - input: "x^2"
        output: "x^2"
      - input: "x**2"
        output: "x^2"
      - input: "(x+1)^3"
        output: "(x+1)^3"
      # ² (touche AZERTY) pré-normalisé par le tokenizer en ^2
      - input: "x²"
        output: "x^2"
      - input: "(x+1)²"
        output: "(x+1)^2"

  # Indice
  - id: subscript_simple
    description: "Indice avec variable atomique"
    match: "IDENT:base UNDERSCORE EXPR:idx"
    template: "{{base}}_{{idx}}"
    examples:
      - input: "u_n"
        output: "u_n"
      - input: "x_0"
        output: "x_0"

  # Fraction avec /
  # ATOM (vs EXPR) pour num/denom : on capture un token seul, un groupe parenthésé
  # ou un appel de fonction — pas une expression greedy. Ça évite que "1/2 + 3"
  # devienne "\frac{1}{2+3}". Les cas non-atomiques sont couverts par la
  # post-passe de fractions dans JoinTokens.
  - id: fraction_inline
    description: "Fraction notée avec /"
    match: "ATOM:num DIV ATOM:denom"
    template: "\\frac{{{num}}}{{{denom}}}"
    examples:
      - input: "1/2"
        output: "\\frac{1}{2}"
      - input: "(x+1)/(x-1)"
        output: "\\frac{x+1}{x-1}"

  # Application de fonction
  - id: function_call
    description: "Appel de fonction f(x), g(x,y)"
    match: "IDENT:f LPAREN EXPR_LIST:args RPAREN"
    template: "{{f}}({{args}})"
    examples:
      - input: "f(x)"
        output: "f(x)"
      - input: "g(x,y)"
        output: "g(x,y)"

  # Dérivée prime
  - id: derivative_prime
    description: "Dérivée notée avec prime"
    match: "IDENT:f PRIME LPAREN EXPR:x RPAREN"
    template: "{{f}}'({{x}})"
    examples:
      - input: "f'(x)"
        output: "f'(x)"
      - input: "g'(t)"
        output: "g'(t)"

  # Fonctions nommées (communes FR/EN)
  - id: named_function_cos
    match: "COS LPAREN? EXPR:arg RPAREN?"
    template: "\\cos({{arg}})"
    tokens_inline:
      COS: { aliases: [cos], canonical: "\\cos" }
    examples:
      - input: "cos(x)"
        output: "\\cos(x)"
      - input: "cos x"
        output: "\\cos(x)"

  - id: named_function_sin
    match: "SIN LPAREN? EXPR:arg RPAREN?"
    template: "\\sin({{arg}})"
    tokens_inline:
      SIN: { aliases: [sin], canonical: "\\sin" }
    examples:
      - input: "sin(x)"
        output: "\\sin(x)"

  - id: named_function_tan
    match: "TAN LPAREN? EXPR:arg RPAREN?"
    template: "\\tan({{arg}})"
    tokens_inline:
      TAN: { aliases: [tan, tg], canonical: "\\tan" }
    examples:
      - input: "tan(x)"
        output: "\\tan(x)"
      - input: "tg(x)"
        output: "\\tan(x)"

  - id: named_function_ln
    match: "LN LPAREN? EXPR:arg RPAREN?"
    template: "\\ln({{arg}})"
    tokens_inline:
      LN: { aliases: [ln], canonical: "\\ln" }
    examples:
      - input: "ln(x)"
        output: "\\ln(x)"

  - id: named_function_log
    match: "LOG LPAREN? EXPR:arg RPAREN?"
    template: "\\log({{arg}})"
    tokens_inline:
      LOG: { aliases: [log, lg], canonical: "\\log" }
    examples:
      - input: "log(x)"
        output: "\\log(x)"

  - id: named_function_exp
    description: "exp(x) → e^{x} — notation standard lycée FR (plus parlante que \\exp)"
    match: "EXP LPAREN? EXPR:arg RPAREN?"
    template: "e^{{{arg}}}"
    tokens_inline:
      EXP: { aliases: [exp], canonical: "\\exp" }
    examples:
      - input: "exp(x)"
        output: "e^{x}"
      - input: "exp(2x+1)"
        output: "e^{2x+1}"

  # Trigo inverse : arccos/acos, arcsin/asin, arctan/atan
  - id: named_function_arccos
    match: "ARCCOS LPAREN? EXPR:arg RPAREN?"
    template: "\\arccos({{arg}})"
    tokens_inline:
      ARCCOS: { aliases: [arccos, acos], canonical: "\\arccos" }
    examples:
      - input: "arccos(x)"
        output: "\\arccos(x)"
      - input: "acos(x)"
        output: "\\arccos(x)"

  - id: named_function_arcsin
    match: "ARCSIN LPAREN? EXPR:arg RPAREN?"
    template: "\\arcsin({{arg}})"
    tokens_inline:
      ARCSIN: { aliases: [arcsin, asin], canonical: "\\arcsin" }
    examples:
      - input: "arcsin(x)"
        output: "\\arcsin(x)"
      - input: "asin(x)"
        output: "\\arcsin(x)"

  - id: named_function_arctan
    match: "ARCTAN LPAREN? EXPR:arg RPAREN?"
    template: "\\arctan({{arg}})"
    tokens_inline:
      ARCTAN: { aliases: [arctan, atan], canonical: "\\arctan" }
    examples:
      - input: "arctan(x)"
        output: "\\arctan(x)"
      - input: "atan(x)"
        output: "\\arctan(x)"

  # Valeur absolue / norme
  - id: absolute_value
    description: "Valeur absolue notée |x|"
    match: "PIPE EXPR:x PIPE"
    template: "|{{x}}|"
    examples:
      - input: "|x|"
        output: "|x|"
      - input: "|x-1|"
        output: "|x-1|"

  - id: vector_norm
    description: "Norme notée ||u||"
    priority: 50  # explicite pour battre union_expr (prio 40) : '||u||' ≠ '| | u | |'
    match: "PIPE PIPE EXPR:u PIPE PIPE"
    template: "\\|{{u}}\\|"
    examples:
      - input: "||u||"
        output: "\\|u\\|"

  # Ensembles canoniques (notations universelles)
  - id: set_reals
    match: "REALS"
    template: "\\mathbb{R}"
    tokens_inline:
      REALS: { aliases: [R, IR] }
    examples:
      - input: "R"
        output: "\\mathbb{R}"

  - id: set_naturals
    match: "NATURALS"
    template: "\\mathbb{N}"
    tokens_inline:
      NATURALS: { aliases: [N, IN] }

  - id: set_integers
    match: "INTEGERS"
    template: "\\mathbb{Z}"
    tokens_inline:
      INTEGERS: { aliases: [Z, IZ] }

  - id: set_rationals
    match: "RATIONALS"
    template: "\\mathbb{Q}"
    tokens_inline:
      RATIONALS: { aliases: [Q, IQ] }

  - id: set_complex
    match: "COMPLEX"
    template: "\\mathbb{C}"
    tokens_inline:
      COMPLEX: { aliases: [C, IC] }

  # Ensembles qualifiés : R*, R+, R- (priorité 55 > set_X 10 pour gagner quand
  # un suffixe est présent).
  - id: set_star
    description: "R*, N*, ... : privé de 0"
    priority: 55
    match: "(REALS|NATURALS|INTEGERS|RATIONALS|COMPLEX):set TIMES"
    template: "{{set}}^*"
    examples:
      - input: "R*"
        output: "\\mathbb{R}^*"
      - input: "N*"
        output: "\\mathbb{N}^*"

  - id: set_plus
    description: "R+, N+, ... : positifs (≥ 0)"
    priority: 55
    match: "(REALS|NATURALS|INTEGERS|RATIONALS|COMPLEX):set PLUS"
    template: "{{set}}^+"
    examples:
      - input: "R+"
        output: "\\mathbb{R}^+"

  - id: set_minus
    description: "R- : négatifs (≤ 0)"
    priority: 55
    match: "(REALS|NATURALS|INTEGERS|RATIONALS|COMPLEX):set MINUS"
    template: "{{set}}^-"
    examples:
      - input: "R-"
        output: "\\mathbb{R}^-"

  # Double suffixe — strictement positif/négatif : R*+, R+*, R*-, R-*
  # Priorité 60 : bat les single-suffix quand les 2 sont présents.
  - id: set_strict_positive_a
    priority: 60
    match: "(REALS|NATURALS|INTEGERS|RATIONALS|COMPLEX):set TIMES PLUS"
    template: "{{set}}^{*+}"
    examples:
      - input: "R*+"
        output: "\\mathbb{R}^{*+}"

  - id: set_strict_positive_b
    priority: 60
    match: "(REALS|NATURALS|INTEGERS|RATIONALS|COMPLEX):set PLUS TIMES"
    template: "{{set}}^{*+}"
    examples:
      - input: "R+*"
        output: "\\mathbb{R}^{*+}"

  - id: set_strict_negative_a
    priority: 60
    match: "(REALS|NATURALS|INTEGERS|RATIONALS|COMPLEX):set TIMES MINUS"
    template: "{{set}}^{*-}"
    examples:
      - input: "R*-"
        output: "\\mathbb{R}^{*-}"

  - id: set_strict_negative_b
    priority: 60
    match: "(REALS|NATURALS|INTEGERS|RATIONALS|COMPLEX):set MINUS TIMES"
    template: "{{set}}^{*-}"
    examples:
      - input: "R-*"
        output: "\\mathbb{R}^{*-}"

  # Exclusion : R\{a} ou R-{a} → R privé de l'élément a
  - id: set_minus_singleton_dash
    description: "R-{0}, R-{-1}, ... : ensemble privé d'un élément"
    priority: 65
    match: "(REALS|NATURALS|INTEGERS|RATIONALS|COMPLEX):set MINUS LBRACE EXPR:val RBRACE"
    template: "{{set}} \\setminus \\{{{val}}\\}"
    examples:
      - input: "R-{0}"
        output: "\\mathbb{R} \\setminus \\{0\\}"
      - input: "R-{-1}"
        output: "\\mathbb{R} \\setminus \\{-1\\}"

  # Exclusion avec slash : R/{2} → R privé de 2 (convention alternative)
  - id: set_minus_singleton_slash
    description: "R/{2} : ensemble privé d'un élément (variante avec /)"
    priority: 65
    match: "(REALS|NATURALS|INTEGERS|RATIONALS|COMPLEX):set DIV LBRACE EXPR:val RBRACE"
    template: "{{set}} \\setminus \\{{{val}}\\}"
    examples:
      - input: "R/{2}"
        output: "\\mathbb{R} \\setminus \\{2\\}"

  # Intervalles FR : [a;b], ]a;b], [a;b[, ]a;b[
  # Séparateur accepté : ';', ',', ou espace (le '(SEMICOLON|COMMA)' optionnel
  # gère les 3 — quand il n'y a ni ';' ni ',', c'est que l'utilisateur a mis
  # un espace entre les bornes, ce qui sépare déjà les tokens.
  - id: interval_closed_closed
    description: "[a;b] / [a,b] / [a b] : intervalle fermé des deux côtés"
    priority: 50
    match: "LBRACKET EXPR:a (SEMICOLON|COMMA) EXPR:b RBRACKET"
    template: "[{{a}}, {{b}}]"
    examples:
      - input: "[0;1]"
        output: "[0, 1]"
      - input: "[0,1]"
        output: "[0, 1]"
      - input: "[0 1]"
        output: "[0, 1]"
      - input: "[-2;5]"
        output: "[-2, 5]"

  - id: interval_closed_open
    description: "[a;b[ / [a,b[ / [a b[ : intervalle semi-ouvert à droite"
    priority: 50
    match: "LBRACKET EXPR:a (SEMICOLON|COMMA) EXPR:b LBRACKET"
    template: "[{{a}}, {{b}}["
    examples:
      - input: "[0;+inf["
        output: "[0, +\\infty["
      - input: "[0,+inf["
        output: "[0, +\\infty["
      - input: "[0 +inf["
        output: "[0, +\\infty["

  - id: interval_open_closed
    description: "]a;b] / ]a,b] / ]a b] : intervalle semi-ouvert à gauche"
    priority: 50
    match: "RBRACKET EXPR:a (SEMICOLON|COMMA) EXPR:b RBRACKET"
    template: "]{{a}}, {{b}}]"
    examples:
      - input: "]0;1]"
        output: "]0, 1]"
      - input: "]-inf;5]"
        output: "]-\\infty, 5]"
      - input: "]0,1]"
        output: "]0, 1]"

  - id: interval_open_open
    description: "]a;b[ / ]a,b[ / ]a b[ : intervalle ouvert des deux côtés"
    priority: 50
    match: "RBRACKET EXPR:a (SEMICOLON|COMMA) EXPR:b LBRACKET"
    template: "]{{a}}, {{b}}["
    examples:
      - input: "]0;1["
        output: "]0, 1["
      - input: "]-inf;+inf["
        output: "]-\\infty, +\\infty["
      - input: "]-inf,+inf["
        output: "]-\\infty, +\\infty["

  # Variantes espace comme séparateur : [0 1], [0 +inf[, ...
  # Priorité 45 (< 50) : les versions avec séparateur explicite gagnent quand applicable.
  - id: interval_closed_closed_space
    description: "[a b] : intervalle fermé, séparateur espace"
    priority: 45
    match: "LBRACKET ATOM:a ATOM:b RBRACKET"
    template: "[{{a}}, {{b}}]"
    examples:
      - input: "[0 1]"
        output: "[0, 1]"

  - id: interval_closed_open_space
    description: "[a b[ : intervalle semi-ouvert à droite, sep espace"
    priority: 45
    match: "LBRACKET ATOM:a ATOM:b LBRACKET"
    template: "[{{a}}, {{b}}["
    examples:
      - input: "[0 +inf["
        output: "[0, +\\infty["

  - id: interval_open_closed_space
    priority: 45
    match: "RBRACKET ATOM:a ATOM:b RBRACKET"
    template: "]{{a}}, {{b}}]"
    examples:
      - input: "]0 1]"
        output: "]0, 1]"

  - id: interval_open_open_space
    priority: 45
    match: "RBRACKET ATOM:a ATOM:b LBRACKET"
    template: "]{{a}}, {{b}}["
    examples:
      - input: "]0 1["
        output: "]0, 1["

  # Union : <expr> U <expr>  (le "U" / "u" entre exprs → \cup)
  # Lowercase 'u' dans le match = LiteralWord case-insensitive, matche "U" et "u".
  - id: union_expr
    description: "A U B → A ∪ B (union d'ensembles / intervalles)"
    priority: 40
    match: "EXPR:a u EXPR:b"
    template: "{{a}} \\cup {{b}}"
    examples:
      - input: "[0;12]U[16;20["
        output: "[0, 12] \\cup [16, 20["

  # Intersection : <expr> inter <expr>
  - id: intersection_expr
    description: "A inter B → A ∩ B"
    priority: 40
    match: "EXPR:a inter EXPR:b"
    template: "{{a}} \\cap {{b}}"
    examples:
      - input: "[0;10] inter [5;15]"
        output: "[0, 10] \\cap [5, 15]"

  # ============================================================
  # Fonctions hyperboliques : sinh/cosh/tanh + raccourcis FR sh/ch/th
  # Priorité par défaut (10). Les réciproques hyperboliques (argsh, argch, argth)
  # sont ensuite ajoutées en plus.
  # ============================================================

  - id: named_function_sinh
    match: "SINH LPAREN? EXPR:arg RPAREN?"
    template: "\\sinh({{arg}})"
    tokens_inline:
      SINH: { aliases: [sinh, sh], canonical: "\\sinh" }
    examples:
      - input: "sinh(x)"
        output: "\\sinh(x)"
      - input: "sh(x)"
        output: "\\sinh(x)"

  - id: named_function_cosh
    match: "COSH LPAREN? EXPR:arg RPAREN?"
    template: "\\cosh({{arg}})"
    tokens_inline:
      COSH: { aliases: [cosh, ch], canonical: "\\cosh" }
    examples:
      - input: "cosh(x)"
        output: "\\cosh(x)"
      - input: "ch(x)"
        output: "\\cosh(x)"

  - id: named_function_tanh
    match: "TANH LPAREN? EXPR:arg RPAREN?"
    template: "\\tanh({{arg}})"
    tokens_inline:
      TANH: { aliases: [tanh, th], canonical: "\\tanh" }
    examples:
      - input: "tanh(x)"
        output: "\\tanh(x)"
      - input: "th(x)"
        output: "\\tanh(x)"

  - id: named_function_argsh
    match: "ARGSH LPAREN? EXPR:arg RPAREN?"
    template: "\\operatorname{argsh}({{arg}})"
    tokens_inline:
      ARGSH: { aliases: [argsh, arcsinh, asinh], canonical: "\\operatorname{argsh}" }
    examples:
      - input: "argsh(x)"
        output: "\\operatorname{argsh}(x)"

  - id: named_function_argch
    match: "ARGCH LPAREN? EXPR:arg RPAREN?"
    template: "\\operatorname{argch}({{arg}})"
    tokens_inline:
      ARGCH: { aliases: [argch, arccosh, acosh], canonical: "\\operatorname{argch}" }
    examples:
      - input: "argch(x)"
        output: "\\operatorname{argch}(x)"

  - id: named_function_argth
    match: "ARGTH LPAREN? EXPR:arg RPAREN?"
    template: "\\operatorname{argth}({{arg}})"
    tokens_inline:
      ARGTH: { aliases: [argth, arctanh, atanh], canonical: "\\operatorname{argth}" }
    examples:
      - input: "argth(x)"
        output: "\\operatorname{argth}(x)"

  # Cotangente, sécante, cosécante
  - id: named_function_cot
    match: "COT LPAREN? EXPR:arg RPAREN?"
    template: "\\cot({{arg}})"
    tokens_inline:
      COT: { aliases: [cot, cotan], canonical: "\\cot" }
    examples:
      - input: "cot(x)"
        output: "\\cot(x)"

  - id: named_function_sec
    match: "SEC LPAREN? EXPR:arg RPAREN?"
    template: "\\sec({{arg}})"
    tokens_inline:
      SEC: { aliases: [sec], canonical: "\\sec" }

  - id: named_function_csc
    match: "CSC LPAREN? EXPR:arg RPAREN?"
    template: "\\csc({{arg}})"
    tokens_inline:
      CSC: { aliases: [csc, cosec], canonical: "\\csc" }

  # ============================================================
  # Puissances de fonctions nommées : sin^2(x), cos²(x), sin2x, ln^2 x
  # Priorité 20 > default (10) : bat la lecture "sin(2x)" quand POWER explicite.
  # Pour la forme collée "sin2x", on propose la lecture puissance en PLUS de
  # la lecture produit (top-k alternatives).
  # ============================================================

  - id: trig_power_explicit
    description: "sin^2(x), cos^3 x, ln^2 x : puissance explicite d'une fonction nommée"
    priority: 20
    match: "(SIN|COS|TAN|COT|SEC|CSC|SINH|COSH|TANH|LN|LOG|EXP|ARCSIN|ARCCOS|ARCTAN):fn POWER ATOM:exp LPAREN? EXPR:arg RPAREN?"
    template: "{{fn}}^{{exp}}({{arg}})"
    examples:
      - input: "sin^2(x)"
        output: "\\sin^2(x)"
      - input: "cos^3 x"
        output: "\\cos^3(x)"
      - input: "ln^2(x)"
        output: "\\ln^2(x)"
      - input: "tan^2 x"
        output: "\\tan^2(x)"

  - id: trig_power_glued
    description: "sin2x, cos3x : lecture puissance (en alternative à la lecture produit)"
    priority: 15
    match: "(SIN|COS|TAN|SINH|COSH|TANH|LN|LOG):fn NUMBER:exp LPAREN? EXPR:arg RPAREN?"
    template: "{{fn}}^{{exp}}({{arg}})"
    examples:
      - input: "sin2x"
        output: "\\sin^2(x)"
      - input: "cos3(x)"
        output: "\\cos^3(x)"

  # ============================================================
  # Factorielle : n!, (n+1)!, N!
  # ATOM permet de capturer un nombre, identifiant ou groupe parenthésé.
  # ============================================================

  - id: factorial
    description: "Factorielle : n!, (n+1)!, 5!"
    priority: 25
    match: "ATOM:n EXCLAM"
    template: "{{n}}!"
    tokens_inline:
      EXCLAM: { aliases: ["!"], canonical: "!" }
    examples:
      - input: "n!"
        output: "n!"
      - input: "5!"
        output: "5!"
      - input: "(n+1)!"
        output: "(n+1)!"

  # ============================================================
  # Coefficient binomial : C(n,k), C_n^k, binom(n,k), comb(n,k)
  # Priorité 50 pour battre function_call (10) sur C(n,k).
  # ============================================================

  - id: binomial_paren
    description: "C(n,k) → coefficient binomial"
    priority: 50
    match: "c LPAREN ATOM:n COMMA ATOM:k RPAREN"
    template: "\\binom{{{n}}}{{{k}}}"
    examples:
      - input: "C(n,k)"
        output: "\\binom{n}{k}"
      - input: "C(5,2)"
        output: "\\binom{5}{2}"

  - id: binomial_indexed
    description: "C_n^k → coefficient binomial (notation française)"
    priority: 50
    match: "c UNDERSCORE ATOM:n POWER ATOM:k"
    template: "\\binom{{{n}}}{{{k}}}"
    examples:
      - input: "C_n^k"
        output: "\\binom{n}{k}"
      - input: "C_5^2"
        output: "\\binom{5}{2}"

  - id: binomial_kw
    description: "binom(n,k) / comb(n,k) → coefficient binomial"
    priority: 50
    match: "BINOM LPAREN ATOM:n COMMA ATOM:k RPAREN"
    template: "\\binom{{{n}}}{{{k}}}"
    tokens_inline:
      BINOM: { aliases: [binom, comb], canonical: "\\binom" }
    examples:
      - input: "binom(n,k)"
        output: "\\binom{n}{k}"
      - input: "comb(10,3)"
        output: "\\binom{10}{3}"

  # ============================================================
  # Landau : o(x^2), O(n log n), Theta(n)
  # LANDAU_O / LANDAU_BIG_O tokenisés séparément pour éviter conflit avec la
  # lettre O et la composition "f o g".
  # ============================================================

  # Petit-o et grand-O de Landau : l'ambiguïté "o" lettre vs notation est gérée
  # en ne créant PAS de token dédié pour "o"/"O" seuls. La notation est rendue
  # via le fallback générique (o(x^2) → o(x^2), O(n) → O(n)). On ajoute juste
  # Theta / Omega pour les lettres grecques majuscules non-ambiguës.
  - id: landau_theta
    description: "Theta(f(n)) → grand-theta de Landau"
    priority: 30
    match: "THETA_UPPER LPAREN EXPR:arg RPAREN"
    template: "\\Theta({{arg}})"
    examples:
      - input: "Theta(n)"
        output: "\\Theta(n)"

  - id: landau_omega
    description: "Omega(f(n)) → grand-omega de Landau"
    priority: 30
    match: "OMEGA_UPPER LPAREN EXPR:arg RPAREN"
    template: "\\Omega({{arg}})"
    examples:
      - input: "Omega(n)"
        output: "\\Omega(n)"

  # ============================================================
  # Composition de fonctions : f ∘ g, f ° g, f \circ g
  # On force le symbole explicite (°, ∘) pour éviter l'ambiguïté avec "o"
  # minuscule (trop fréquent comme variable).
  # ============================================================

  - id: function_composition
    description: "f ∘ g / f ° g → composition de fonctions"
    priority: 30
    match: "ATOM:f COMPOSE ATOM:g"
    template: "{{f}} \\circ {{g}}"
    tokens_inline:
      COMPOSE: { aliases: ["°", "∘", "\\circ"], canonical: "\\circ" }
    examples:
      - input: "f°g"
        output: "f \\circ g"
      - input: "f ∘ g"
        output: "f \\circ g"

  # ============================================================
  # Plus-ou-moins : ±, +-, +/- → \pm
  # Tokenisé comme un seul opérateur (pas de pattern, rendu direct).
  # ============================================================
  # (voir section tokens pour PLUSMINUS)

  # ============================================================
  # Moyenne statistique : xbarre, y bar → \overline{x}, \overline{y}
  # Deux formes : collée ("xbarre") via slot IDENT_BAR ; espacée ("x barre")
  # via pattern littéral "barre" suivant un IDENT.
  # ============================================================

  - id: mean_overline_glued
    description: "xbarre / ybar → \\overline{x} (suffixe collé)"
    priority: 60
    match: "IDENT_BAR:name"
    template: "\\overline{{{name}}}"
    examples:
      - input: "xbarre"
        output: "\\overline{x}"
      - input: "ybarre"
        output: "\\overline{y}"
      - input: "xbar"
        output: "\\overline{x}"

  - id: mean_overline_spaced
    description: "x barre → \\overline{x} (espace avant le suffixe)"
    priority: 60
    match: "IDENT:name (barre|bar)"
    template: "\\overline{{{name}}}"
    examples:
      - input: "x barre"
        output: "\\overline{x}"
      - input: "y bar"
        output: "\\overline{y}"

  # ============================================================
  # Pourcentage : 30% → 30\%, 10{,}16% → 10{,}16\%
  # ============================================================

  - id: percent_number
    description: "Nombre suivi de % → nombre\\%"
    priority: 55
    match: "ATOM:n PERCENT"
    template: "{{n}}\\%"
    examples:
      - input: "30%"
        output: "30\\%"
      - input: "75%"
        output: "75\\%"

  # ============================================================
  # Coordonnée indexée par un point : xA, yB, zM → x_A, y_B, z_M
  # Convention FR : la lettre minuscule après x/y/z désigne aussi un point,
  # qu'on normalise en majuscule (xa → x_A).
  # ============================================================

  - id: coord_point
    description: "xA, yB, xm → x_A, y_B, x_M (coordonnée indexée par un point)"
    priority: 60
    match: "COORD_POINT:coord"
    template: "{{coord}}"
    examples:
      - input: "xA"
        output: "x_A"
      - input: "yB"
        output: "y_B"
      - input: "xa"
        output: "x_A"
      - input: "ym"
        output: "y_M"

  # ============================================================
  # Fonction avec mapsto : f : x ↦ x^2, g : t |-> 2t+3
  # ============================================================

  - id: function_mapsto
    description: "f : x ↦ <expr> → notation formelle de fonction"
    priority: 110
    match: "IDENT:f COLON IDENT:var MAPSTO EXPR:image"
    template: "{{f}} : {{var}} \\mapsto {{image}}"
    examples:
      - input: "f : x ↦ x^2"
        output: "f : x \\mapsto x^2"
      - input: "f : x |-> x^2"
        output: "f : x \\mapsto x^2"
      - input: "g : t ↦ 2t+3"
        output: "g : t \\mapsto 2t+3"

  # ============================================================
  # Segment, droite, demi-droite (géométrie FR)
  # Coexistent avec les intervalles : prior = segment/droite si contenu est
  # strictement IDENT_UPPER_PAIR (deux majuscules accolées).
  # ============================================================

  - id: segment_bracketed
    description: "[AB] → segment (deux majuscules accolées)"
    priority: 55
    match: "LBRACKET IDENT_UPPER_PAIR:name RBRACKET"
    template: "[{{name}}]"
    examples:
      - input: "[AB]"
        output: "[AB]"
      - input: "[CD]"
        output: "[CD]"

  - id: line_parenthesized
    description: "(AB) → droite passant par A et B"
    priority: 55
    match: "LPAREN IDENT_UPPER_PAIR:name RPAREN"
    template: "({{name}})"
    examples:
      - input: "(AB)"
        output: "(AB)"

  - id: half_line_right_open
    description: "[AB) → demi-droite fermée en A"
    priority: 55
    match: "LBRACKET IDENT_UPPER_PAIR:name RPAREN"
    template: "[{{name}})"
    examples:
      - input: "[AB)"
        output: "[AB)"

  - id: half_line_left_open
    description: "(AB] → demi-droite fermée en B"
    priority: 55
    match: "LPAREN IDENT_UPPER_PAIR:name RBRACKET"
    template: "({{name}}]"
    examples:
      - input: "(AB]"
        output: "(AB]"

  # ============================================================
  # Point / double point de Newton : dot x, ddot x → \dot{x}, \ddot{x}
  # ============================================================

  - id: dot_newton
    description: "dot x → \\dot{x} (dérivée temporelle)"
    priority: 25
    match: "DOT_KW IDENT:x"
    template: "\\dot{{{x}}}"
    tokens_inline:
      DOT_KW: { aliases: [dot], canonical: "\\dot" }
    examples:
      - input: "dot x"
        output: "\\dot{x}"

  - id: ddot_newton
    description: "ddot x → \\ddot{x} (dérivée seconde temporelle)"
    priority: 25
    match: "DDOT_KW IDENT:x"
    template: "\\ddot{{{x}}}"
    tokens_inline:
      DDOT_KW: { aliases: [ddot], canonical: "\\ddot" }
    examples:
      - input: "ddot x"
        output: "\\ddot{x}"

  # ============================================================
  # Dérivée partielle : partial f / partial x → \frac{\partial f}{\partial x}
  # ============================================================

  - id: partial_derivative
    description: "∂f/∂x ou partial f / partial x → \\frac{\\partial f}{\\partial x}"
    priority: 25
    match: "PARTIAL IDENT:f DIV PARTIAL IDENT:x"
    template: "\\frac{\\partial {{f}}}{\\partial {{x}}}"
    examples:
      - input: "∂f/∂x"
        output: "\\frac{\\partial f}{\\partial x}"
      - input: "partial f / partial x"
        output: "\\frac{\\partial f}{\\partial x}"

  # ============================================================
  # Intégrales avec dx élégant : \int f dx → \int f \, dx (un espace fin avant dx)
  # ============================================================

  - id: double_integral
    description: "iint f dx dy → \\iint f \\, dx \\, dy"
    priority: 30
    match: "IINT EXPR:f dx dy"
    template: "\\iint {{f}} \\, dx \\, dy"
    examples:
      - input: "iint f dx dy"
        output: "\\iint f \\, dx \\, dy"

  - id: contour_integral
    description: "oint f dl → \\oint f \\, dl"
    priority: 30
    match: "OINT EXPR:f dl"
    template: "\\oint {{f}} \\, dl"
    examples:
      - input: "oint f dl"
        output: "\\oint f \\, dl"

  # ============================================================
  # Opérateurs nommés factorisés (det, tr, rg, Vect, Ker, Im, card, Dom,
  # cov, corr, diag, mes, sigma, Re, Im_z, arg, rank, trace, pgcd, ppcm, lcm...)
  # Un seul pattern gère la forme "NAME LPAREN? EXPR RPAREN?" — chaque opérateur
  # est une alias d'un token dédié avec son propre canonical.
  # Priorité 25 > default (10) : bat function_call / generic_expression.
  # ============================================================

  - id: named_operator_call
    description: "Opérateur nommé appliqué : det(A), tr(A), Vect(u,v), Ker f, Im(f)..."
    priority: 25
    match: "(DET|TRACE_OP|RANK_OP|RANG_OP|VECT_OP|KER_OP|IM_OP|DOM_OP|CARD_OP|DIAG_OP|COV_OP|CORR_OP|MES_OP|RE_OP|ARG_OP|DIM_OP|GCD_OP|PPCM_OP|LCM_OP):op LPAREN? EXPR:arg RPAREN?"
    template: "{{op}}({{arg}})"
    tokens_inline:
      DET:      { aliases: [det, determinant],         canonical: "\\det" }
      TRACE_OP: { aliases: [tr, trace],                canonical: "\\operatorname{tr}" }
      RANK_OP:  { aliases: [rank],                     canonical: "\\operatorname{rank}" }
      RANG_OP:  { aliases: [rg, rang],                 canonical: "\\operatorname{rg}" }
      VECT_OP:  { aliases: [Vect],                     canonical: "\\operatorname{Vect}" }
      KER_OP:   { aliases: [Ker, ker, noyau],          canonical: "\\ker" }
      IM_OP:    { aliases: [Image, image],             canonical: "\\operatorname{Im}" }
      DOM_OP:   { aliases: [Dom, dom],                 canonical: "\\operatorname{Dom}" }
      CARD_OP:  { aliases: [card, cardinal],           canonical: "\\operatorname{card}" }
      DIAG_OP:  { aliases: [diag],                     canonical: "\\operatorname{diag}" }
      COV_OP:   { aliases: [cov, Cov, covariance],     canonical: "\\operatorname{Cov}" }
      CORR_OP:  { aliases: [corr, Corr, correlation],  canonical: "\\operatorname{Corr}" }
      MES_OP:   { aliases: [mes],                      canonical: "\\operatorname{mes}" }
      RE_OP:    { aliases: [Re],                       canonical: "\\operatorname{Re}" }
      ARG_OP:   { aliases: [arg],                      canonical: "\\arg" }
      DIM_OP:   { aliases: [dim, dimension],           canonical: "\\dim" }
      GCD_OP:   { aliases: [gcd, pgcd],                canonical: "\\gcd" }
      PPCM_OP:  { aliases: [ppcm],                     canonical: "\\operatorname{ppcm}" }
      LCM_OP:   { aliases: [lcm],                      canonical: "\\operatorname{lcm}" }
    examples:
      - input: "det(A)"
        output: "\\det(A)"
      - input: "tr(A)"
        output: "\\operatorname{tr}(A)"
      - input: "rg(A)"
        output: "\\operatorname{rg}(A)"
      - input: "Vect(u,v)"
        output: "\\operatorname{Vect}(u,v)"
      - input: "Ker f"
        output: "\\ker(f)"
      - input: "card(A)"
        output: "\\operatorname{card}(A)"
      - input: "diag(1,2,3)"
        output: "\\operatorname{diag}(1,2,3)"
      - input: "cov(X,Y)"
        output: "\\operatorname{Cov}(X,Y)"
      - input: "pgcd(m,n)"
        output: "\\gcd(m,n)"
      - input: "gcd(m,n)"
        output: "\\gcd(m,n)"
      - input: "ppcm(m,n)"
        output: "\\operatorname{ppcm}(m,n)"
      - input: "dim E"
        output: "\\dim(E)"
      - input: "Dom(f)"
        output: "\\operatorname{Dom}(f)"

# Tokens définis en fin de fichier (injectés également via tokens_inline ci-dessus)
tokens:
  PRIME:
    canonical: "'"
    aliases: ["'", "’"]

  # Opérateurs ensemblistes (language-agnostic)
  INTER:
    canonical: "\\cap"
    aliases: [inter, "∩"]

  UNION:
    canonical: "\\cup"
    aliases: [union, "∪"]

  # Plus-ou-moins : tokenizé en un seul opérateur, rendu direct par JoinTokens.
  PLUSMINUS:
    canonical: "\\pm"
    aliases: ["±", "+-", "+/-"]

  # Approximatif : ≈ / ~= déjà mappés à APPROX dans core. Ajoutons "≈" et "\approx".
  APPROX_SYM:
    canonical: "\\approx"
    aliases: ["≈", "\\approx"]

  # Proportionnel
  PROP_TO:
    canonical: "\\propto"
    aliases: ["∝", "\\propto", "propto"]

  # Équivalent asymptotique
  TILDE_SIM:
    canonical: "\\sim"
    aliases: ["\\sim"]

  # Inclusion d'ensembles
  SUBSET:
    canonical: "\\subset"
    aliases: ["⊂", "\\subset", "subset"]

  SUBSETEQ:
    canonical: "\\subseteq"
    aliases: ["⊆", "\\subseteq", "subseteq"]

  # Opérateurs différentiels
  PARTIAL:
    canonical: "\\partial"
    aliases: ["∂", "\\partial", "partial"]

  NABLA:
    canonical: "\\nabla"
    aliases: ["∇", "\\nabla", "nabla", grad]

  LAPLACIAN:
    canonical: "\\Delta"
    aliases: [laplacien]

  # Dérivée temporelle (point de Newton)
  DOT_ACCENT:
    canonical: "\\dot"
    aliases: ["\\dot"]

  DDOT_ACCENT:
    canonical: "\\ddot"
    aliases: ["\\ddot"]

  # Équivalence asymptotique
  SIM:
    canonical: "\\sim"
    aliases: ["~"]

  # Modulo
  MOD:
    canonical: "\\bmod"
    aliases: [mod, modulo]

  # Différence d'ensembles : \ → \setminus
  SETMINUS:
    canonical: "\\setminus"
    aliases: ["\\"]

  # Limites sup / inf
  LIMSUP:
    canonical: "\\limsup"
    aliases: [limsup]

  LIMINF:
    canonical: "\\liminf"
    aliases: [liminf]

  # Approximation : word form "approx" manquait
  APPROX_KW:
    canonical: "\\approx"
    aliases: [approx]

  # Produits tensoriel / direct
  OTIMES:
    canonical: "\\otimes"
    aliases: [otimes]

  OPLUS:
    canonical: "\\oplus"
    aliases: [oplus]

  # Intégrales multiples / de contour
  IINT:
    canonical: "\\iint"
    aliases: [iint]

  IIINT:
    canonical: "\\iiint"
    aliases: [iiint]

  OINT:
    canonical: "\\oint"
    aliases: [oint]

  # Exists unique
  EXISTS_UNIQUE:
    canonical: "\\exists!"
    aliases: ["exists!", "∃!"]

  # Divisibilité
  MID:
    canonical: "\\mid"
    aliases: ["\\mid"]

  NMID:
    canonical: "\\nmid"
    aliases: ["\\nmid", "!|"]

  # Parallèle / perpendiculaire
  PARALLEL:
    canonical: "\\parallel"
    aliases: ["∥", "//", "\\parallel"]

  PERP:
    canonical: "\\perp"
    aliases: ["⊥", "\\perp", perp]

  # Définition :=
  COLONEQ:
    canonical: "\\coloneqq"
    aliases: [":=", "\\coloneqq"]

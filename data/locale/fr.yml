# Vocabulaire MathCursor (locale FR) — brief v4 §3.
# Synonymes semés depuis le corpus, pas l'imagination.
# Cf. ADR 2026-05-22-Feat-engine-poc-isolation.

classes:
  to:       ['->', '→', 'td', 'tend vers']
  filler:   ['quand', 'lorsque']
  dir:      ['+', '-', '⁺', '⁻']
  union_op: ['union', 'U', '∪']
  inter_op: ['inter', 'inter', '∩']

anchors:
  limite: lim
  somme:  sum
  # Alias EN (= conv internationale courante, user-report 2026-05-24
  # `F:x-> sum k 0 f(k)*x` n'était pas reconnu).
  sum:    sum
  produit: prod
  prod:   prod
  integrale: int
  int: int
  derivee: derive
  derive: derive
  iint: iint
  intint: iint
  lim: lim
  # P17 — quantificateurs logiques.
  forall: forall
  V: forall
  '∀': forall
  exists: exists
  E: exists
  '∃': exists
  # P23 — fractions, racines, vecteurs.
  frac: frac
  fraction: frac
  racine: sqrt
  sqrt: sqrt
  vec: vec
  vecteur: vec
  # P29 — norme.
  norm: norm
  norme: norm
  congru: congru
  congruent: congru
  # P23 : pas d'anchor pour P (= juste un identifier libre).
  # P(A) est rendu par le parser : P + (A) → produit implicite → P(A).

functions:
  # ─── Lettres grecques minuscules (24) ────────────────────────
  # 2026-05-25 : prefix-match popup + reclasse direct au tokenizer.
  alpha:   '\alpha'
  beta:    '\beta'
  gamma:   '\gamma'
  delta:   '\delta'
  epsilon: '\epsilon'
  zeta:    '\zeta'
  eta:     '\eta'
  theta:   '\theta'
  iota:    '\iota'
  kappa:   '\kappa'
  lambda:  '\lambda'
  mu:      '\mu'
  nu:      '\nu'
  xi:      '\xi'
  omicron: 'o'
  pi:      '\pi'
  rho:     '\rho'
  sigma:   '\sigma'
  tau:     '\tau'
  upsilon: '\upsilon'
  phi:     '\phi'
  chi:     '\chi'
  psi:     '\psi'
  omega:   '\omega'
  # ─── Lettres grecques majuscules (11 distinctes du latin) ────
  # Les autres (Alpha, Beta, Epsilon, ...) n'ont pas de cmd LaTeX
  # dédiée — utiliser la lettre latine équivalente.
  Gamma:   '\Gamma'
  Delta:   '\Delta'
  Theta:   '\Theta'
  Lambda:  '\Lambda'
  Xi:      '\Xi'
  Pi:      '\Pi'
  Sigma:   '\Sigma'
  Upsilon: '\Upsilon'
  Phi:     '\Phi'
  Psi:     '\Psi'
  Omega:   '\Omega'
  # ─── Fonctions math standards ────────────────────────────────
  sin:  '\sin'
  cos:  '\cos'
  tan:  '\tan'
  cot:  '\cot'
  sec:  '\sec'
  csc:  '\csc'
  arcsin: '\arcsin'
  arccos: '\arccos'
  arctan: '\arctan'
  sinh: '\sinh'
  cosh: '\cosh'
  tanh: '\tanh'
  ln:   '\ln'
  log:  '\log'
  exp:  '\exp'
  min:  '\min'
  max:  '\max'
  sup:  '\sup'
  # `inf` = infinity (= sémantique math courante : +inf, -inf).
  # Pour l'infimum mathématique, taper `infimum`.
  inf:  '\infty'
  oo:   '\infty'
  infty: '\infty'
  infinity: '\infty'
  infimum: '\inf'
  det:  '\det'
  tr:   '\operatorname{tr}'
  tg:   '\tan'
  ch:   '\cosh'
  sh:   '\sinh'
  th:   '\tanh'
  pgcd: '\gcd'
  ppcm: '\operatorname{ppcm}'
  # P18 — ensembles canoniques mappés via tokenizer.
  R:    '\mathbb{R}'
  N:    '\mathbb{N}'
  Z:    '\mathbb{Z}'
  Q:    '\mathbb{Q}'
  C:    '\mathbb{C}'
  ℝ:    '\mathbb{R}'
  ℕ:    '\mathbb{N}'
  ℤ:    '\mathbb{Z}'
  ℚ:    '\mathbb{Q}'
  ℂ:    '\mathbb{C}'

# Relations : table de précédence multi-tier (brief §1.2).
# Tiers (du plus fort au plus faible) :
#   funcpow > muldiv > addsub > setop > comp > rel > and > or > implies > iff
relations:
  # P2 (2026-05-24) — flags YAML data-driven :
  # - compact: true        → rendu sans espace autour (a+b vs a + b)
  # - allow_leading: true  → autorisé en préfixe unaire en début d'expr
  # - align_prefix: '...'  → préfixe LaTeX en mode multi-line align*
  #   ('' vide = chaîne d'égalités via `&`, pas un prefix visible)
  # - context: '...'       → condition d'activation au reclasse Word→Symbol
  '+':      { tex: '+',           tier: addsub,  compact: true, allow_leading: true }
  '-':      { tex: '-',           tier: addsub,  compact: true, allow_leading: true }
  # FR : `*` = `\times` (= ×, conv européenne). User-report 2026-05-24
  # « devrait chercher la locale de l'utilisateur pour faire mult (x)
  # en europe ». EN garde `\cdot`. Note : `\cdotIM` (produit implicite
  # letter+number) reste indépendant, géré au parser.
  '*':      { tex: '\times',      tier: muldiv }
  '·':      { tex: '\cdot',       tier: muldiv }
  '/':      { tex: '/',           tier: muldiv }
  '^':      { tex: '^',           tier: funcpow }
  '_':      { tex: '_',           tier: funcpow }
  '∪':      { tex: '\cup',        tier: setop }
  '∩':      { tex: '\cap',        tier: setop }
  # P28 (2026-05-22) : produit scalaire explicite `.` (= u.v → u \cdot v).
  '.':      { tex: '\cdot',       tier: muldiv }
  'U':      { tex: '\cup',        tier: setop }
  # `u` minuscule = `\cup` UNIQUEMENT entre 2 intervalles (= context
  # condition data-driven, évite le conflit avec la lettre `u` dans
  # `f(u)`, `2u`, etc.). User-report 2026-05-24 `[0,1[ u [0,1]`.
  'u':      { tex: '\cup',        tier: setop, context: isolated_between_brackets }
  'inter':  { tex: '\cap',        tier: setop }
  # P2 : `=` est align-able (= chaîne d'égalités via `&`, pas de prefix
  # visible) + leading autorisé (= continuation de chaîne d'équivalences).
  '=':      { tex: '=',           tier: comp, allow_leading: true, align_prefix: '' }
  '!=':     { tex: '\neq',        tier: comp }
  '<':      { tex: '<',           tier: comp }
  '>':      { tex: '>',           tier: comp }
  # P2 : `<=` en début de ligne en mode align = `\Leftarrow` (= conv FR
  # reverse implication multi-ligne). Tex normal = `\leq` (= leq inline).
  '<=':     { tex: '\leq',        tier: comp, allow_leading: true, align_prefix: '\Leftarrow' }
  '>=':     { tex: '\geq',        tier: comp }
  '≤':      { tex: '\leq',        tier: comp }
  '≥':      { tex: '\geq',        tier: comp }
  '≠':      { tex: '\neq',        tier: comp }
  'in':     { tex: '\in',         tier: rel }
  '∈':      { tex: '\in',         tier: rel }
  '⊂':      { tex: '\subset',     tier: rel }
  # `//` = parallèle penché (= notation manuscrite). \mathbin{/\!/}
  # rend 2 slashes penchés avec espacement correct. \parallel donnerait
  # le symbole vertical ‖ qui n'est pas l'attendu user FR.
  '//':     { tex: '\mathbin{/\!/}', tier: rel }
  '∥':      { tex: '\parallel',   tier: rel }
  '⊥':      { tex: '\perp',       tier: rel }
  'perp':   { tex: '\perp',       tier: rel }
  'congru': { tex: '\equiv',      tier: rel, tail: mod }
  '≡':      { tex: '\equiv',      tier: rel, tail: mod }
  # P29 (2026-05-22) : `mod` infixe spécial — `wrap: true` indique que
  # le rendu est `<tex>{<next operand>}` au lieu de l'infixe binaire.
  # Ex. `a congru b mod 7` → `a \equiv b \pmod{7}`.
  'mod':    { tex: '\pmod',       tier: rel, wrap: true }
  'et':     { tex: '\land',       tier: and }
  '∧':      { tex: '\land',       tier: and }
  'ou':     { tex: '\lor',        tier: or }
  '∨':      { tex: '\lor',        tier: or }
  # P2 (2026-05-24) : markers align multi-line + leading autorisé.
  '=>':     { tex: '\implies',    tier: implies, allow_leading: true, align_prefix: '\Rightarrow' }
  '⇒':      { tex: '\implies',    tier: implies, allow_leading: true, align_prefix: '\Rightarrow' }
  '<=>':    { tex: '\iff',        tier: iff,     allow_leading: true, align_prefix: '\Leftrightarrow' }
  '⇔':      { tex: '\iff',        tier: iff,     allow_leading: true, align_prefix: '\Leftrightarrow' }
  # Variants Unicode supplémentaires (legacy ADR).
  '↔':      { tex: '\iff',        tier: iff,     allow_leading: true, align_prefix: '\Leftrightarrow' }
  '⟺':      { tex: '\iff',        tier: iff,     allow_leading: true, align_prefix: '\Leftrightarrow' }
  '⟹':      { tex: '\implies',    tier: implies, allow_leading: true, align_prefix: '\Rightarrow' }
  '⇐':      { tex: '\Leftarrow',  tier: implies, allow_leading: true, align_prefix: '\Leftarrow' }
  '⟸':      { tex: '\Leftarrow',  tier: implies, allow_leading: true, align_prefix: '\Leftarrow' }
  '<==':    { tex: '\Leftarrow',  tier: implies, allow_leading: true, align_prefix: '\Leftarrow' }
  '<==>':   { tex: '\iff',        tier: iff,     allow_leading: true, align_prefix: '\Leftrightarrow' }
  '==>':    { tex: '\implies',    tier: implies, allow_leading: true, align_prefix: '\Rightarrow' }

# Tokens "glue" qui ne séparent pas (brief §1.1) — appartiennent à un slot.
glue:    ['->', '=', '→']

# Séparateurs de liste (par locale).
# FR : la virgule est prise par la décimale → seul l'espace fait colonne.
colsep:  [' ']
rowsep:  [';']
decimal: ','

# ─── Span detection FR (= Ctrl+Espace backward scan) ─────────────
# Migration 2026-05-25 : ces listes étaient hardcodées dans
# ManualTriggerController + ZoneRefiner (= adapter VSTO). Maintenant
# data-driven dans le vocab locale (= cohérent avec stopwords FR).
#
# stopwords : mots-outils qui bornent la span (= remontée backward
# depuis le caret s'arrête juste après un stopword).
stopwords:
  - soit
  - soient
  - et
  - ou
  - donc
  - alors
  - avec
  - si
  - on
  - car
  - mais
  - ainsi
  - puis
  - comme
  - tout
  - un
  - une
  - le
  - la
  - les
  - des
  - du
  - de
  - pour
  - par
  - sur
  - dans
  - au
  - aux

# span_delimiters : caractères qui bornent la span (= ponctuation +
# relations comp). `,` et `:` exclus (= opérateurs math légitimes).
# `\n` `\r` traités séparément (= multi-line block).
span_delimiters:
  - '.'
  - ';'
  - '!'
  - '?'
  - '='
  - '<'
  - '>'
  - "\n"
  - "\r"

# math_prefix_keywords : mots dont la zone détectée juste à droite
# doit être étendue rétroactivement pour les inclure (= zone extension
# backward). Ex: "limite x→0 f(x)" → la zone capture "limite" pour
# que l'engine produise `\lim`.
math_prefix_keywords:
  - lim
  - limite
  - lmt
  - sqrt
  - rac
  - racine
  - int
  - integrale
  - integ
  - integral
  - sum
  - somme
  - forall
  - qq
  - qqe
  - exists
  - existe
  - vec
  - vect
  - vecteur

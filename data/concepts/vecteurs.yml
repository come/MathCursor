# Concept : vecteurs.

concept: vecteurs
rules:

  - id: vec-explicit
    pattern: "vec {body}"
    produces: vector
    emit:    "\\vec{$body}"
    tests:
      - "vec u => \\vec{u}"
      - "vec v => \\vec{v}"
      - "vec AB => \\vec{AB}"
      - "vec CD => \\vec{CD}"
      - "vec n+1 => \\vec{n+1}"

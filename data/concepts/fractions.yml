# Concept : fractions et racines.
#
# `a/b` est géré par la règle primitive `prim-frac-implicit` (core C#).
# Ce fichier couvre la syntaxe explicite `frac a b` + racines.

concept: fractions
rules:

  # Fraction explicite : frac num den → \frac{num}{den}
  - id: frac-explicit
    pattern: "frac {num} {den}"
    produces: expr
    emit:    "\\frac{$num}{$den}"
    tests:
      - "frac a b => \\frac{a}{b}"
      - "frac 1 2 => \\frac{1}{2}"
      - "frac (x+1) (x-1) => \\frac{x+1}{x-1}"
      - "frac n n+1 => \\frac{n}{n+1}"

  # Racine carrée : sqrt body → \sqrt{body}
  - id: racine-carree
    pattern: "sqrt {body}"
    produces: expr
    emit:    "\\sqrt{$body}"
    allow_partial: true
    tests:
      - "sqrt 2 => \\sqrt{2}"
      - "sqrt x => \\sqrt{x}"
      - "sqrt (x+1) => \\sqrt{x+1}"
      - "sqrt x^2+y^2 => \\sqrt{x^2+y^2}"

  # Racine n-ième : sqrt n body → \sqrt[n]{body}.
  # `n:number` force l'ordre numérique (= sinon ambiguïté avec racine-carree).
  - id: racine-niem
    pattern: "sqrt {n:number} {body}"
    produces: expr
    emit:    "\\sqrt[$n]{$body}"
    allow_partial: true
    tests:
      - "sqrt 3 8 => \\sqrt[3]{8}"
      - "sqrt 4 16 => \\sqrt[4]{16}"

# Concept : limites.
#
# `<filler>?` et `<to>?` sont des classes optionnelles résolues via
# `data/locale/fr.yml` section `classes:` :
#   filler: ['quand', 'lorsque']
#   to:     ['->', '→', 'td', 'tend vers']

concept: limites
rules:

  - id: limite-x-to-bound
    pattern: "lim <filler>? {var:letter} <to>? {a} {body}"
    produces: expr
    emit:    "\\lim_{$var \\to $a} $body"
    allow_partial: true
    tests:
      - "lim x->0 f(x) => \\lim_{x \\to 0} f(x)"
      - "lim x 0 f(x) => \\lim_{x \\to 0} f(x)"
      - "lim quand x tend vers 0 f(x) => \\lim_{x \\to 0} f(x)"
      - "lim x 0 2x+1 => \\lim_{x \\to 0} 2x+1"
      - "lim x +oo f(x) => \\lim_{x \\to +\\infty} f(x)"
      - "lim x +inf f(x) => \\lim_{x \\to +\\infty} f(x)"
      - "lim x -inf f(x) => \\lim_{x \\to -\\infty} f(x)"
      - "lim x 0 1/x+1 => \\lim_{x \\to 0} \\frac{1}{x}+1"

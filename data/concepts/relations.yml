# Relations binaires : comparaisons, implications, appartenance.
#
# Le tokenizer lit les multi-char (`<=>`, `=>`, `<=`, `!=`) comme un seul
# token (= dérivé de vocab relations). Ces règles les composent en infixe.
# Priorité 50 (= primitives), tournent après les anchors mot-clé.

concept: relations
rules:

  - id: rel-iff
    pattern:  "{a} <=> {b}"
    produces: expr
    emit:     "$a \\iff $b"
    priority: 50

  - id: rel-implies
    pattern:  "{a} => {b}"
    produces: expr
    emit:     "$a \\implies $b"
    priority: 50

  - id: rel-leq
    pattern:  "{a} <= {b}"
    produces: expr
    emit:     "$a \\leq $b"
    priority: 50

  - id: rel-geq
    pattern:  "{a} >= {b}"
    produces: expr
    emit:     "$a \\geq $b"
    priority: 50

  - id: rel-neq
    pattern:  "{a} != {b}"
    produces: expr
    emit:     "$a \\neq $b"
    priority: 50

  # Comparaisons à symbole littéral (= , < , >) : rendu tight (= sans
  # espace), conforme à la convention math FR `n>0`, `x=1`.
  - id: rel-eq
    pattern:  "{a} = {b}"
    produces: expr
    emit:     "$a=$b"
    priority: 50

  - id: rel-lt
    pattern:  "{a} < {b}"
    produces: expr
    emit:     "$a<$b"
    priority: 50

  - id: rel-gt
    pattern:  "{a} > {b}"
    produces: expr
    emit:     "$a>$b"
    priority: 50

  - id: rel-in
    pattern:  "{a} in {b:set}"
    produces: expr
    emit:     "$a \\in $b"
    priority: 50

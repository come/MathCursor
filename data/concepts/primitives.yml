# Primitives — règles de composition de base.
#
# Priorité < 50 = phase 0 (fusion token-level, avant les binaires).
# Priorité 50   = phase 1 (binaires : +, -, /, ^, _, parens, function-call).
# Le glued (= absence d'espace) est exprimé par l'adjacence dans le pattern :
#   "{a:number}{b:letter}" (collé) vs "{a} + {b}" (espacé).

concept: primitives
rules:

  # ── Phase 0 : fusion token-level ──────────────────────────────
  # Décimale FR : `0,5` (collé) → un Number. Hors d'un contexte liste
  # (= intervalle/ensemble) où le `,` est séparateur. L'ordre de
  # réécriture tranche : la règle structurelle (intervalle) split le `,`
  # avant que cette règle ne tourne.
  - id: prim-decimal
    pattern:  "{a:number},{b:number}"
    produces: number
    emit:     "$a,$b"
    priority: 20
    tests:
      - "3,14 => 3,14"
      - "5+0,5 => 5+0,5"

  - id: prim-signed-infinity
    pattern:  "{s:symbol}\\infty"
    produces: number
    emit:     "$s\\infty"
    priority: 20

  - id: prim-implicit-product
    pattern:  "{a:number}{b:letter}"
    produces: expr
    emit:     "$a$b"
    priority: 20

  # Lettre+chiffre collés : exposant par défaut, indice en alternative
  # (= collision math typique x² vs x₂, exposée dans la popup).
  - id: prim-letter-num-superscript
    pattern:  "{a:letter}{b:number}"
    produces: expr
    emit:     "$a^{$b}"
    priority: 20

  - id: prim-letter-num-subscript
    pattern:  "{a:letter}{b:number}"
    produces: expr
    emit:     "$a_{$b}"
    priority: 19

  # ── Phase 1 : binaires + groupes ──────────────────────────────
  - id: prim-paren-group
    pattern:  "( {inner} )"
    produces: expr
    emit:     "$inner"
    priority: 50

  - id: prim-add
    pattern:  "{a} + {b}"
    produces: expr
    emit:     "$a+$b"
    priority: 50

  - id: prim-sub
    pattern:  "{a} - {b}"
    produces: expr
    emit:     "$a-$b"
    priority: 50

  - id: prim-frac-implicit
    pattern:  "{a} / {b}"
    produces: expr
    emit:     "\\frac{$a}{$b}"
    priority: 50

  - id: prim-superscript
    pattern:  "{a} ^ {b}"
    produces: expr
    emit:     "$a^$b"
    priority: 50

  - id: prim-subscript
    pattern:  "{a} _ {b}"
    produces: expr
    emit:     "$a_$b"
    priority: 50

  # Function-call LaTeX (\sin, \cos) : {f:function}.
  - id: prim-function-call-fn
    pattern:  "{f:function}( {a} )"
    produces: expr
    emit:     "$f($a)"
    priority: 50

  # Function-call utilisateur 1 arg (f(x), g(k), P(A)) : {f:letter}.
  - id: prim-function-call-1
    pattern:  "{f:letter}( {a} )"
    produces: expr
    emit:     "$f($a)"
    priority: 50

  # Function-call 2 args (f(x,y)).
  - id: prim-function-call-2
    pattern:  "{f:letter}( {a} , {b} )"
    produces: expr
    emit:     "$f($a,$b)"
    priority: 50

# Matrices — slot grid 2D.
#
# Le slot {g:grid} capture entre les délimiteurs, découpe par ';' (lignes)
# puis espace (cellules), résout chaque cellule. Lignes/colonnes variables.
# Une grille triviale (1 cellule) n'est pas une matrice (= paren-group).

concept: matrices
rules:

  - id: matrix-paren
    pattern:  "( {g:grid} )"
    produces: matrix
    emit:     "\\begin{pmatrix}$g\\end{pmatrix}"
    tests:
      - "(1 2 ; 3 4) => \\begin{pmatrix}1 & 2 \\\\ 3 & 4\\end{pmatrix}"
      - "(1 2 3 ; 4 5 6) => \\begin{pmatrix}1 & 2 & 3 \\\\ 4 & 5 & 6\\end{pmatrix}"
      - "(1 ; 2 ; 3) => \\begin{pmatrix}1 \\\\ 2 \\\\ 3\\end{pmatrix}"
      - "(x+1 2y ; 0 1) => \\begin{pmatrix}x+1 & 2y \\\\ 0 & 1\\end{pmatrix}"

  - id: matrix-bracket
    pattern:  "[ {g:grid} ]"
    produces: matrix
    emit:     "\\begin{bmatrix}$g\\end{bmatrix}"
    tests:
      - "[1 2 ; 3 4] => \\begin{bmatrix}1 & 2 \\\\ 3 & 4\\end{bmatrix}"

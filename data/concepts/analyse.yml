# Concept : intégrales et dérivées.

concept: analyse
rules:

  # Intégrale définie : int var from to body → \int_{from}^{to} body \, dvar
  - id: integrale-def
    pattern: "int {var:letter} {from} {to} {body}"
    produces: expr
    emit:    "\\int_{$from}^{$to} $body \\, d$var"
    allow_partial: true
    tests:
      - "int x 0 1 x => \\int_{0}^{1} x \\, dx"
      - "int x 0 1 x^2 => \\int_{0}^{1} x^2 \\, dx"
      - "int t 0 +oo f(t) => \\int_{0}^{+\\infty} f(t) \\, dt"
      - "int t 0 +inf f(t) => \\int_{0}^{+\\infty} f(t) \\, dt"

  # Intégrale indéfinie : int var body (= 2 slots, pas de bornes).
  - id: integrale-indef
    pattern: "int {var:letter} {body}"
    produces: expr
    emit:    "\\int $body \\, d$var"
    allow_partial: true
    tests:
      - "int x 2x => \\int 2x \\, dx"
      - "int t sin(t) => \\int \\sin(t) \\, dt"

  # Dérivée : derive var body → \frac{d}{dvar} body
  - id: derivee
    pattern: "derive {var:letter} {body}"
    produces: expr
    emit:    "\\frac{d}{d$var} $body"
    allow_partial: true
    tests:
      - "derive x x^2 => \\frac{d}{dx} x^2"
      - "derive t e^t => \\frac{d}{dt} e^t"
      - "derive x sin(x) => \\frac{d}{dx} \\sin(x)"

  # Intégrale double : iint var1 var2 body
  - id: integrale-double
    pattern: "iint {var1:letter} {var2:letter} {body}"
    produces: expr
    emit:    "\\iint $body \\, d$var1 \\, d$var2"
    allow_partial: true
    tests:
      - "iint x y f(x,y) => \\iint f(x,y) \\, dx \\, dy"
      - "iint x y g(x,y) => \\iint g(x,y) \\, dx \\, dy"

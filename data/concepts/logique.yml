# Concept : logique — quantificateurs ∀ ∃.

concept: logique
rules:

  # ∀ avec domaine d'appartenance + body : forall x R P(x) → ∀x ∈ ℝ, P(x)
  - id: forall-belongs
    pattern: "forall {var:letter} {set} {body}"
    produces: expr
    emit:    "\\forall $var \\in $set, $body"
    tests:
      - "forall x R P(x) => \\forall x \\in \\mathbb{R}, P(x)"
      - "forall n N n>0 => \\forall n \\in \\mathbb{N}, n>0"

  # ∀ forme courte (= sans body).
  - id: forall-belongs-short
    pattern: "forall {var:letter} {set}"
    produces: expr
    emit:    "\\forall $var \\in $set"
    tests:
      - "forall x R => \\forall x \\in \\mathbb{R}"

  - id: exists-belongs
    pattern: "exists {var:letter} {set} {body}"
    produces: expr
    emit:    "\\exists $var \\in $set, $body"
    tests:
      - "exists x R x>0 => \\exists x \\in \\mathbb{R}, x>0"

  - id: exists-belongs-short
    pattern: "exists {var:letter} {set}"
    produces: expr
    emit:    "\\exists $var \\in $set"
    tests:
      - "exists y N => \\exists y \\in \\mathbb{N}"

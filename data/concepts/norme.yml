# Concept : norme.
#
# `norm v` → \|v\| ; `norm (x+y)` → \|x+y\| (parens composées par
# `prim-paren-group`). Pour limiter le scope : utiliser parens explicites.

concept: norme
rules:

  - id: norme
    pattern: "norm {arg}"
    produces: expr
    emit:    "\\|$arg\\|"
    tests:
      - "norm u => \\|u\\|"
      - "norm AB => \\|AB\\|"
      - "norm (x+y) => \\|x+y\\|"
      - "norm v+1 => \\|v+1\\|"

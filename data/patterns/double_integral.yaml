# Pattern double_integral — intégrale double
# 3 slots positionnels : var1, var2, expression (multi-token)
# Variante de IntegralTemplate avec rendu \iint (double integral)
# NOUVEAU PATTERN P9h — créé uniquement via YAML, sans .cs

template_id: double_integral
order: 0

heads:
  - { source: iint,   latex: '\iint', mutation: iint, weight: 100 }
  - { source: Iint,   latex: '\iint', mutation: iint, weight: 100 }
  - { source: intint, latex: '\iint', mutation: iint, weight: 90 }
  - { source: '∬',    latex: '\iint', mutation: iint, weight: 100 }

slots:
  - { position: 0, name: var1 }
  - { position: 1, name: var2 }
  - { position: 2, name: expression, multi_token: true }

scoring:
  base: 25
  per_slot: 25

render:
  preview: '\iint <expression> \, d<var1> \, d<var2>'
  hint:    '\iint <expression|\square> \, d<var1|\square> \, d<var2|\square>'
  description: '∬ <expression|▭> d<var1|▭> d<var2|▭>'

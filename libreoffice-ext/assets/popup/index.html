<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="katex/katex.min.css">
<script src="katex/katex.min.js"></script>
<style>
  /* Sobre : rectangle net, AUCUN arrondi, AUCUNE ombre. Le panneau remplit la
     fenêtre (fond blanc), bordure fine, bandeau de sélection plat pleine largeur. */
  html, body { margin: 0; padding: 0; background: #fff; overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif; color: #1f2328; }
  #box { border: 1px solid #b4b4b4; min-width: 150px; user-select: none; }
  .cand { display: flex; align-items: center; padding: 6px 14px; cursor: pointer;
    white-space: nowrap; }
  .cand:hover { background: #efefef; }
  .cand.sel { background: #d6e4ff; }
  .cand-render { font-size: 18px; color: #111; }
  .err { color: #b00; font-family: Consolas, monospace; font-size: 12px; padding: 6px; }
</style>
</head>
<body>
<div id="box"></div>
<script>
  let _cands = [], _sel = -1;

  function render() {
    const box = document.getElementById("box");
    box.innerHTML = "";
    // _sel < 0 = rien de surligné (état initial : la popup ne fait que suggérer).
    // ↓ entre dans la liste (sélectionne le 1ᵉʳ, même s'il est unique).
    _cands.forEach((c, i) => {
      const row = document.createElement("div");
      row.className = "cand" + (i === _sel ? " sel" : "");
      const r = document.createElement("div");
      r.className = "cand-render";
      try { katex.render(c.latex, r, { throwOnError: false, displayMode: false }); }
      catch (e) { r.textContent = c.latex; }
      row.appendChild(r);  // rendu KaTeX seul (pas de source LaTeX)
      row.addEventListener("click", () => mcCommit(i));
      box.appendChild(row);
    });
  }

  // Appelé par l'hôte (pywebview evaluate_js / Tauri eval)
  window.mcRender = function (candidates, selectedIndex) {
    _cands = candidates || [];
    _sel = (typeof selectedIndex === "number") ? selectedIndex : -1; render();
    // poste la taille mesurée du contenu pour que l'hôte dimensionne la fenêtre
    const b = document.getElementById("box").getBoundingClientRect();
    const sz = JSON.stringify({ w: Math.ceil(b.width), h: Math.ceil(b.height) });
    try { if (window.ipc) window.ipc.postMessage("size:" + sz); } catch (e) {}
    return sz;
  };
  window.mcSetIndex = function (i) { _sel = i; render(); };

  // mcCommit / mcDismiss : injectés/branchés par l'hôte. Stubs par défaut.
  window.mcCommit = window.mcCommit || function (i) { console.log("commit " + i); };
  window.mcDismiss = window.mcDismiss || function () { console.log("dismiss"); };
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") mcDismiss(); });

  // Handshake : signale à l'hôte que la page (et KaTeX) est prête. Évite la race
  // où l'hôte envoie `show` avant que window.mcRender existe (popup vide).
  function _signalLoaded() { try { if (window.ipc) window.ipc.postMessage("loaded"); } catch (e) {} }
  if (document.readyState === "complete" || document.readyState === "interactive") _signalLoaded();
  else document.addEventListener("DOMContentLoaded", _signalLoaded);
</script>
</body>
</html>
